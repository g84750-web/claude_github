name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'douzone-erp-ai-platform/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 — 진행 중인 실행은 취소하지 않고 순서대로 처리한다
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: douzone-erp-ai-platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: douzone-erp-ai-platform/package-lock.json

      - run: npm ci

      # 절대 제약 검증 + 데이터 정합성 + 타입 체크가 build 스크립트에 포함되어 있다
      - name: Test
        run: npm run test

      - name: Build
        # 프로젝트 페이지는 /<repo>/ 하위에 게시되므로 base 를 맞춘다
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # 정적 호스팅 없이도 열 수 있는 단일 파일을 함께 게시한다
      - name: Build single-file bundle
        run: npx tsx scripts/build-singlefile.ts

      # SPA 는 아니지만, 잘못된 경로 진입 시 앱으로 떨어지도록 404 를 대체한다
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: douzone-erp-ai-platform/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
