<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업종별 ERP 시뮬레이션 툴</title>
<style>
:root {
  --c1:#2563eb; --c1l:#dbeafe; --c1d:#1d4ed8;
  --c2:#10b981; --c2l:#d1fae5;
  --c3:#f59e0b; --c3l:#fef3c7;
  --c4:#ef4444; --c4l:#fee2e2;
  --c5:#8b5cf6; --c5l:#ede9fe;
  --bg:#f1f5f9; --card:#fff;
  --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --radius:10px; --shadow:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
#top-header{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200}
#top-header .logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
#top-header .logo span{color:#60a5fa}
#top-header nav{display:flex;gap:4px;margin-left:auto}
#top-header nav a{color:#94a3b8;font-size:12px;padding:5px 12px;border-radius:6px;text-decoration:none;transition:.15s}
#top-header nav a:hover{background:rgba(255,255,255,.1);color:#fff}
#top-header nav a.active{background:var(--c1);color:#fff}

/* INDUSTRY TABS */
#industry-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto}
#industry-bar::-webkit-scrollbar{display:none}
.ind-tab{padding:14px 20px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ind-tab:hover{color:var(--c1)}
.ind-tab.active{color:var(--c1);border-bottom-color:var(--c1)}
.ind-tab .ind-icon{font-size:16px}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:24px}

/* SECTION CARDS */
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.section-grid.col3{grid-template-columns:1fr 1fr 1fr}
.section-grid.col1{grid-template-columns:1fr}
@media(max-width:900px){.section-grid,.section-grid.col3{grid-template-columns:1fr}}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px}
.card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;display:flex;align-items:center;gap:6px}

/* KPI ROW */
#kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px;border-top:4px solid var(--c1);cursor:default;transition:.15s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.kpi-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:800;color:var(--text)}
.kpi-unit{font-size:11px;color:var(--muted);margin-top:2px}
.kpi-change{font-size:11px;margin-top:4px}
.kpi-change.up{color:var(--c2)} .kpi-change.down{color:var(--c4)}

/* FLOW CHART */
#flow-wrap{overflow-x:auto;padding:8px 0}
.flow-row{display:flex;align-items:center;gap:0;min-width:max-content}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.flow-box{width:110px;padding:10px 8px;border-radius:8px;border:2px solid var(--border);background:#f8fafc;text-align:center;font-size:12px;font-weight:600;transition:.2s;position:relative}
.flow-box:hover,.flow-box.active{border-color:var(--c1);background:var(--c1l);color:var(--c1)}
.flow-box .dept{font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}
.flow-arrow{width:36px;height:2px;background:#cbd5e1;position:relative;flex-shrink:0}
.flow-arrow::after{content:'▶';position:absolute;right:-7px;top:-7px;font-size:12px;color:#94a3b8}
.flow-sub{font-size:10px;color:var(--muted);text-align:center;max-width:110px}

/* DETAIL PANEL */
#detail-panel{background:var(--c1l);border:1px solid var(--c1);border-radius:var(--radius);padding:16px;margin-top:16px;display:none}
#detail-panel.show{display:block}
#detail-title{font-size:14px;font-weight:700;color:var(--c1d);margin-bottom:10px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.detail-item{background:#fff;border-radius:6px;padding:10px 12px;border:1px solid #bfdbfe}
.detail-item .d-label{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px}
.detail-item .d-value{font-size:13px;font-weight:600;color:var(--text)}

/* ERP SCREEN SIMULATOR */
#erp-sim{border:2px solid var(--border);border-radius:var(--radius);overflow:hidden}
#erp-sim-header{background:#1e293b;color:#e2e8f0;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12px}
#erp-sim-toolbar{background:#f8fafc;border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:6px}
.sim-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;transition:.12s;font-family:inherit}
.sim-btn:hover{background:var(--c1l);border-color:var(--c1);color:var(--c1)}
.sim-btn.primary{background:var(--c1);color:#fff;border-color:var(--c1)}
#erp-sim-body{padding:14px;min-height:200px}

/* GRID TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:#f1f5f9;padding:8px 10px;text-align:left;font-weight:700;font-size:11px;border:1px solid var(--border);color:var(--muted)}
.data-table td{padding:7px 10px;border:1px solid #f1f5f9;color:var(--text)}
.data-table tr:hover td{background:#f8fafc}
.data-table tr.selected td{background:var(--c1l);color:var(--c1)}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.badge.완료{background:#d1fae5;color:#065f46}
.badge.진행{background:#dbeafe;color:#1e40af}
.badge.대기{background:#fef3c7;color:#92400e}
.badge.반려{background:#fee2e2;color:#991b1b}

/* CHART */
.chart-wrap{position:relative;height:200px}
canvas{display:block}

/* MINI FORM */
.mini-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-form label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.mini-form input,.mini-form select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit}
.mini-form input:focus,.mini-form select:focus{outline:none;border-color:var(--c1)}
.form-full{grid-column:1/-1}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;z-index:9999;pointer-events:none;border-left:3px solid var(--c2)}
#toast.show{opacity:1;transform:translateY(0)}

/* STEP PROGRESS */
.step-bar{display:flex;gap:0;margin-bottom:20px}
.step-item{flex:1;text-align:center;position:relative}
.step-item:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:0}
.step-item.done:not(:last-child)::after{background:var(--c2)}
.step-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 4px;position:relative;z-index:1;transition:.2s}
.step-item.done .step-circle{background:var(--c2);border-color:var(--c2);color:#fff}
.step-item.active .step-circle{background:var(--c1);border-color:var(--c1);color:#fff}
.step-label{font-size:10px;color:var(--muted)}
.step-item.active .step-label{color:var(--c1);font-weight:600}
.step-item.done .step-label{color:var(--c2)}

/* TAB CONTENT */
.tab-content{display:none}
.tab-content.active{display:block}

/* MFG MODULE TABS */
#mfg-module-bar{display:none;gap:4px;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--border)}
.mod-tab{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:.12s;font-family:inherit}
.mod-tab:hover{border-color:var(--c1);color:var(--c1)}
.mod-tab.active{background:var(--c1);color:#fff;border-color:var(--c1)}
.mod-label{font-size:10px;color:var(--muted);padding:8px 12px 2px;font-weight:600;letter-spacing:.04em}

/* ── AI KPI 대시보드 ── */
#ai-dashboard-card{display:none}
#ai-dashboard-card.visible{display:block}
.ai-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ai-kpi-card{background:linear-gradient(145deg,#0f172a,#1e2d45);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;border:1px solid #2d4a6e}
.ai-step-name{font-size:9px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.ai-step-label{font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:10px;line-height:1.4;min-height:32px}
.rpa-bar-wrap{height:6px;background:#1e3a5f;border-radius:3px;margin-bottom:8px;overflow:hidden}
.rpa-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#10b981,#2563eb);transition:width 1s ease}
.rpa-pct-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rpa-pct{font-size:22px;font-weight:900;color:#f1f5f9}
.rpa-pct small{font-size:11px;color:#64748b;font-weight:600}
.rpa-sublabel{font-size:9px;color:#475569;font-weight:700;letter-spacing:.04em}
.rpa-times{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rpa-time-box{background:#0b1425;border-radius:5px;padding:5px 8px;border:1px solid #2d4a6e}
.rpa-time-label{font-size:9px;color:#64748b;font-weight:700;margin-bottom:2px}
.rpa-time-val{font-size:12px;font-weight:800}
.rpa-time-val.asis{color:#f87171}
.rpa-time-val.tobe{color:#34d399}
.rpa-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;margin-top:8px;letter-spacing:.04em}
.rpa-badge.high{background:#10b98118;color:#34d399;border:1px solid #10b98130}
.rpa-badge.med{background:#3b82f618;color:#93c5fd;border:1px solid #3b82f630}
.rpa-badge.low{background:#f59e0b18;color:#fcd34d;border:1px solid #f59e0b30}

/* ── AI 하단 영역 (타임라인 + 시나리오) ── */
#ai-bottom-row{display:none;grid-template-columns:270px 1fr;gap:20px;margin-bottom:20px}
.ai-tl-wrap{display:flex;flex-direction:column;gap:0}
.tl-row{display:grid;grid-template-columns:56px 18px 1fr;align-items:start;gap:0 8px;position:relative}
.tl-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0}
.tl-connector{width:2px;background:#e2e8f0;flex:1;min-height:20px;margin:0 auto}
.tl-period{font-size:9px;font-weight:700;color:var(--muted);text-align:right;padding-top:1px;white-space:nowrap}
.tl-body{padding-bottom:14px}
.tl-phase-name{font-size:11px;font-weight:800;margin-bottom:5px}
.tl-task{font-size:11px;color:#475569;background:#f8fafc;border-radius:4px;padding:3px 9px;margin-bottom:3px;border-left:2px solid}
.ai-scenario-box{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.ai-scen-header{background:#0f172a;color:#e2e8f0;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700}
.ai-scen-body{padding:14px 16px}
.scen-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.scen-col{border-radius:8px;padding:11px 13px}
.scen-col.asis{background:#fef2f2;border-left:3px solid #ef4444}
.scen-col.tobe{background:#f0fdf4;border-left:3px solid #10b981}
.scen-col h5{font-size:11px;font-weight:700;margin-bottom:7px}
.scen-col.asis h5{color:#b91c1c}
.scen-col.tobe h5{color:#065f46}
.scen-col li{font-size:11px;line-height:1.6;color:var(--text);list-style:none;display:flex;align-items:flex-start;gap:5px}
.scen-col li::before{content:'→';flex-shrink:0;font-weight:700}
.scen-col.asis li::before{color:#ef4444}
.scen-col.tobe li::before{color:#10b981}
.scen-tech{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tech-tag{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;background:var(--c1l);color:var(--c1);border:1px solid #bfdbfe}
.scen-desc{font-size:12px;line-height:1.9;color:#334155;background:#f8fafc;border-radius:7px;padding:11px 14px;border:1px solid var(--border)}

/* ── 수평 타임라인 ── */
.ai-tl-horiz{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:start;gap:0}
.tl-phase-col{padding:4px 10px}
.tl-phase-dot{width:26px;height:26px;border-radius:50%;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-bottom:6px}
.tl-phase-connector{display:flex;align-items:flex-start;justify-content:center;padding-top:7px;color:#94a3b8;font-size:18px;font-weight:300}
.tl-phase-title{font-size:11px;font-weight:800;margin-bottom:2px}
.tl-phase-period{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}

/* ── AI 탭 시스템 ── */
.ai-tab-bar{display:flex;gap:4px;background:#f1f5f9;border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:8px 12px;flex-wrap:wrap}
.ai-tab-btn{padding:6px 14px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit}
.ai-tab-btn:hover{background:var(--c1l);color:var(--c1)}
.ai-tab-btn.active{background:var(--c1);color:#fff;border-color:var(--c1)}
.ai-tab-btn.eis-btn.active{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-color:#2d4a6e}
.ai-tab-panel{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:20px;min-height:280px}

/* ── KPI 다차원 차트 탭 ── */
.ai-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.ai-chart-grid{grid-template-columns:1fr}}
.ai-chart-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.ai-chart-card canvas{width:100%!important;height:200px!important}

/* ── 데이터표 탭 ── */
.kpi-data-table{width:100%;border-collapse:collapse;font-size:12px}
.kpi-data-table th{background:#0f172a;color:#e2e8f0;padding:9px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em}
.kpi-data-table td{padding:8px 12px;border-bottom:1px solid #f1f5f9;color:var(--text)}
.kpi-data-table tr:hover td{background:#f8fafc}
.kpi-data-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kpi-data-table .improve{color:var(--c2)}
.kpi-data-table .pct-bar{display:inline-block;height:6px;border-radius:3px;background:var(--c1);margin-left:6px;vertical-align:middle}

/* ── AI 시나리오 로드맵 (재설계) ── */
.scen-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--c1)}
.scen-section{margin-bottom:20px}
.scen-mini-flow{display:flex;align-items:flex-start;overflow-x:auto;padding:8px 2px 12px}
.scen-flow-step{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.scen-flow-box{width:124px;background:linear-gradient(145deg,#0f172a,#1e2d45);border-radius:10px;padding:11px 9px;text-align:center;border:1px solid #2d4a6e}
.scen-flow-arr{width:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding-top:18px;color:#475569;font-size:13px}
.scen-flow-name{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;line-height:1.3}
.scen-flow-rpa{font-size:22px;font-weight:900;color:#34d399;line-height:1}
.scen-flow-rpa small{font-size:10px;color:#64748b}
.scen-flow-ai{font-size:9px;color:#60a5fa;margin:4px 0 6px;line-height:1.4}
.scen-flow-times{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
.scen-flow-time{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}
.scen-flow-time.asis{background:#7f1d1d;color:#fca5a5}
.scen-flow-time.tobe{background:#064e3b;color:#6ee7b7}

.matrix-table{width:100%;border-collapse:collapse;font-size:11px;min-width:860px}
.matrix-table th{background:#0f172a;color:#94a3b8;padding:9px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border-right:1px solid #1e3a5f}
.matrix-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f8fafc;color:var(--text);vertical-align:top;line-height:1.5}
.matrix-table tbody tr:hover td{background:#f8fafc}
.matrix-table .col-step{font-weight:700;color:var(--c1);white-space:nowrap;min-width:90px}
.matrix-table .col-dept{color:var(--muted);font-size:10px;white-space:nowrap}
.mtag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;margin:1px 2px 1px 0;white-space:nowrap}
.mtag.ai{background:#dbeafe;color:#1d4ed8}
.mtag.int{background:#d1fae5;color:#065f46}
.mtag.ext{background:#ede9fe;color:#7c3aed}
.mtag.src{background:#fef3c7;color:#92400e}

.arch-grid{display:grid;grid-template-columns:1fr 118px 1fr;gap:10px;margin:8px 0}
.arch-col{border-radius:8px;padding:12px;border:1px solid var(--border)}
.arch-col.int-col{background:#f0f9ff;border-color:#bae6fd}
.arch-col.ext-col{background:#faf5ff;border-color:#ddd6fe}
.arch-col-title{font-size:10px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.arch-col.int-col .arch-col-title{color:#0369a1}
.arch-col.ext-col .arch-col-title{color:#7c3aed}
.arch-item-row{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:5px;margin-bottom:3px;font-size:11px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06)}
.arch-center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.arch-erp-box{background:linear-gradient(145deg,#0f172a,#1e3a5f);border-radius:8px;padding:8px 6px;text-align:center;width:100%;border:1px solid #2d4a6e}
.arch-erp-title{font-size:10px;font-weight:800;color:#60a5fa;margin-bottom:5px}
.arch-erp-item{font-size:9px;color:#94a3b8;padding:1px 0;border-bottom:1px solid #1e3a5f}
.arch-erp-item:last-child{border-bottom:none}
.arch-conn{color:#94a3b8;font-size:14px;font-weight:300;text-align:center;padding:4px 0}

.roadmap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0}
.roadmap-phase{border-radius:8px;padding:12px 14px;border:1.5px solid}
.roadmap-phase-num{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.roadmap-phase-title{font-size:13px;font-weight:800;margin-bottom:3px}
.roadmap-phase-period{font-size:10px;font-weight:600;margin-bottom:10px;opacity:.7}
.roadmap-task-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.07);color:#475569;line-height:1.4}
.roadmap-task-row:last-child{border-bottom:none}
.roadmap-task-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:2px}
@media(max-width:768px){.roadmap-grid{grid-template-columns:1fr}.arch-grid{grid-template-columns:1fr}}

/* ── 케이스 프로파일 리뉴얼 ── */
.cp-new{border-radius:12px;border:1.5px solid;padding:16px 20px}
.cp-header-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.cp-name-badge{font-size:18px;font-weight:800}
.cp-live-chip{font-size:10px;font-weight:700;color:#fff;padding:3px 10px;border-radius:10px}
.cp-meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.cp-erp-line{font-size:11px;font-weight:600;margin-top:6px}
.cp-body-grid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-top:10px}
.cp-stats-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cp-stat-card{background:rgba(255,255,255,.9);border-radius:8px;padding:9px 14px;text-align:center;border:1px solid rgba(0,0,0,.08);min-width:88px}
.cp-stat-icon{font-size:15px;margin-bottom:2px}
.cp-stat-val{font-size:16px;font-weight:800;line-height:1.1}
.cp-stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.cp-ba-btn{cursor:pointer;border:1.5px solid;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700;background:rgba(255,255,255,.9);transition:.15s;white-space:nowrap}
.cp-ba-panel{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.1)}
.ba-grid{display:grid;grid-template-columns:1fr 36px 1fr;gap:10px;align-items:start}
.ba-col{font-size:11px;padding:10px 13px;border-radius:8px}
.ba-col.before{background:#fef2f2;border-left:3px solid #ef4444}
.ba-col.after{background:#f0fdf4;border-left:3px solid #10b981}
.ba-col h6{font-size:10px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.ba-col.before h6{color:#b91c1c}.ba-col.after h6{color:#065f46}
.ba-col li{list-style:none;padding:2px 0;display:flex;align-items:flex-start;gap:4px;line-height:1.5;color:var(--text)}
.ba-col li::before{content:'·';flex-shrink:0;font-weight:700}
.ba-col.before li::before{color:#ef4444}.ba-col.after li::before{color:#10b981}
.ba-arrows-col{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding-top:28px}
.ba-arrow{font-size:18px;color:#2563eb;animation:ba-pulse 1.8s ease-in-out infinite}
.ba-arrow:nth-child(2){animation-delay:.45s}.ba-arrow:nth-child(3){animation-delay:.9s}.ba-arrow:nth-child(4){animation-delay:1.35s}
@keyframes ba-pulse{0%,100%{opacity:.15;transform:translateX(-5px)}50%{opacity:1;transform:translateX(5px)}}
/* OQC Timeline */
.oqc-wf-bar{display:flex;align-items:center;background:#f8fafc;border-radius:8px;padding:10px 14px;overflow-x:auto;margin-bottom:12px;gap:0}
.oqc-wf-step{display:flex;flex-direction:column;align-items:center;min-width:72px;flex-shrink:0}
.oqc-wf-dot{width:22px;height:22px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;margin-bottom:3px;transition:.3s}
.oqc-wf-dot.done{background:var(--c2);border-color:var(--c2);color:#fff}
.oqc-wf-dot.active{background:var(--c1);border-color:var(--c1);color:#fff;animation:wf-pulse 1.5s ease-in-out infinite}
.oqc-wf-dot.pending{background:#fff;border-color:#cbd5e1;color:#94a3b8}
.oqc-wf-lbl{font-size:8px;font-weight:700;text-align:center;line-height:1.3;color:var(--muted)}
.oqc-wf-val{font-size:8px;color:var(--c1);text-align:center;font-weight:700}
.oqc-wf-conn{flex:1;height:2px;background:#e2e8f0;flex-shrink:0;min-width:14px}
.oqc-wf-conn.done{background:var(--c2)}
@keyframes wf-pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 6px rgba(37,99,235,0)}}
.oqc-notify{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;margin-bottom:8px;border:1px solid}
.oqc-notify.warn{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.oqc-notify.info{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}
.oqc-notify.ok{background:#d1fae5;border-color:#10b981;color:#065f46}
.oqc-progress-wrap{margin-bottom:12px}
.oqc-progress-bar{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin:4px 0}
.oqc-progress-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:5px;transition:width 1s ease}

/* ── EIS 대시보드 ── */
.eis-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:12px 18px;background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:var(--radius);color:#e2e8f0;flex-wrap:wrap}
.eis-clock{font-size:30px;font-weight:900;color:#60a5fa;font-variant-numeric:tabular-nums;letter-spacing:3px}
.eis-clock-label{font-size:9px;color:#475569;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.eis-sim-badge{background:#10b98120;border:1px solid #10b98140;color:#34d399;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.eis-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.eis-kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;border-top:3px solid var(--c1);position:relative;overflow:hidden}
.eis-kpi .ek-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.eis-kpi .ek-val{font-size:22px;font-weight:900;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.eis-kpi .ek-sub{font-size:10px;color:var(--muted);margin-top:3px}
.eis-kpi .ek-badge{position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:800}
.eis-kpi .ek-badge.good{background:#d1fae5;color:#065f46}.eis-kpi .ek-badge.warn{background:#fef3c7;color:#92400e}.eis-kpi .ek-badge.danger{background:#fee2e2;color:#991b1b}
.eis-mid-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:900px){.eis-mid-grid{grid-template-columns:1fr}}
.eis-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;min-height:160px}
.eis-panel-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.eis-alert-item{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:11px;line-height:1.5}
.eis-alert-item:last-child{border-bottom:none}
.eis-alert-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.eis-todo-item{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11px;cursor:pointer;user-select:none}
.eis-todo-cb{width:15px;height:15px;border-radius:3px;border:2px solid var(--c1);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:.15s}
.eis-todo-cb.done{background:var(--c2);border-color:var(--c2);color:#fff}
.eis-sched-item{padding:5px 0 5px 9px;border-left:3px solid var(--c1);margin-bottom:5px;font-size:11px}
.eis-sched-time{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:1px}
.eis-bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:900px){.eis-bottom-grid{grid-template-columns:1fr}}
.eis-chart-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.eis-gauge-row{display:flex;flex-direction:column;gap:10px}
.eis-gauge{display:grid;grid-template-columns:82px 1fr 44px;align-items:center;gap:8px}
.eis-gauge-label{font-size:11px;color:var(--text);font-weight:600}
.eis-gauge-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.eis-gauge-fill{height:100%;border-radius:4px;transition:width .8s ease}
.eis-gauge-pct{font-size:11px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.eis-trend-tabs{display:flex;gap:4px;flex-wrap:wrap}
.eis-trend-btn{padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);transition:.12s;font-family:inherit}
.eis-trend-btn.active{background:var(--c1);color:#fff;border-color:var(--c1)}
</style>
</head>

let currentInd = 'manufacturing';
let currentMfgModule = 'sales';
let currentFlowStep = 3;
let trendChart = null, pieChart = null;
let simMode = 'query';  // new | query

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function selectIndustry(key, btn) {
  currentInd = key;
  document.querySelectorAll('.ind-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const d = INDUSTRIES[currentInd];
  renderCaseProfile();
  renderKPIs(d);
  renderSteps(d);
  renderFlow(d);
  renderSimulator(d);
  renderTable(d);
  renderCharts(d);
  renderAlerts(d);
}

  const el = document.getElementById('case-profile-banner');
  if (!el) return;
  const cfg = CASE_PROFILES[currentInd];
  if (!cfg) { el.innerHTML = ''; return; }
  const c = cfg.color || '#2563eb';
  const bid = 'cp-ba-' + currentInd;
  el.innerHTML = `
    <div class="cp-new" style="background:linear-gradient(135deg,${c}12,${c}05);border-color:${c}35">
      <div class="cp-header-row">
        <span class="cp-name-badge" style="color:${c}">${cfg.company}</span>
        <span class="cp-live-chip" style="background:${c}">${cfg.live}</span>
      </div>
      <div class="cp-meta">${cfg.type}</div>
      <div class="cp-meta">${cfg.scale}</div>
      <div class="cp-erp-line" style="color:${c}">⚙️ ${cfg.erp}</div>
      <div class="cp-body-grid">
        <div class="cp-stats-row">
          ${cfg.stats.map(s=>`
            <div class="cp-stat-card" style="border-color:${c}20">

              <div class="cp-stat-val" style="color:${c}">${s.v}</div>

          `).join('')}
        </div>
        <button class="cp-ba-btn" style="color:${c};border-color:${c}50" onclick="toggleCpBA('${bid}',this)">
          📊 도입 전/후 비교 ▾

            <ul>${cfg.before.map(b=>`<li>${b}</li>`).join('')}</ul>
          </div>
          <div class="ba-arrows-col">
            ${cfg.before.map(()=>`<div class="ba-arrow">→</div>`).join('')}

function toggleCpBA(id, btn) {
  const panel = document.getElementById(id);
  if (!panel) return;
  const open = panel.style.display !== 'block';
  panel.style.display = open ? 'block' : 'none';
  btn.textContent = open ? '📊 도입 전/후 비교 ▴' : '📊 도입 전/후 비교 ▾';
}

function renderKPIs(d) {
  const row = document.getElementById('kpi-row');
  row.innerHTML = d.kpis.map(k => `
    <div class="kpi-card" style="border-top-color:${k.color}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-unit">${k.unit}</div>
      <div class="kpi-change ${k.up?'up':'down'}">${k.up?'▲':'▼'} ${k.change}</div>
    </div>
  `).join('');
}

function renderSteps(d) {
  const bar = document.getElementById('step-bar');
  const active = currentFlowStep;
  bar.innerHTML = d.steps.map((s,i) => `
    <div class="step-item ${i<active?'done':i===active?'active':''}">
      <div class="step-circle">${i<active?'✓':i+1}</div>
      <div class="step-label">${s}</div>
    </div>
  `).join('');
}

function renderFlow(d) {
  const row = document.getElementById('flow-row');
  row.innerHTML = '';
  d.flow.forEach((f, i) => {
    const step = document.createElement('div');
    step.className = 'flow-step';
    step.innerHTML = `
      <div class="flow-box" onclick="showFlowDetail(${i})" id="fbox-${i}">
        <div>${f.name}</div>
        <div class="dept">${f.dept}</div>
      </div>
      <div class="flow-sub">${f.step}</div>
    `;
    row.appendChild(step);
    if (i < d.flow.length - 1) {
      const arr = document.createElement('div');
      arr.className = 'flow-arrow';
      arr.style.marginTop = '-14px';
      row.appendChild(arr);
    }
  });
}

function showFlowDetail(idx) {
  const d = INDUSTRIES[currentInd];
  const f = d.flow[idx];
  currentFlowStep = idx;
  document.querySelectorAll('.flow-box').forEach(b => b.classList.remove('active'));
  document.getElementById('fbox-'+idx).classList.add('active');
  renderSteps(d);
  // Switch ERP module for manufacturing
  if (currentInd === 'manufacturing') {
    const modMap = {0:'sales',1:'production',2:'production',3:'purchase',4:'production',5:'quality',6:'quality',7:'master'};
    const mod = modMap[idx] || 'sales';
    setMfgModule(mod);
  }
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-title').innerHTML = `📌 <b>${f.step}</b> — ${f.dept} (${f.name})`;
  const aiNote = f.aiNote ? `<div class="detail-item" style="grid-column:1/-1;background:#f0fdf4;border-color:#bbf7d0"><div class="d-label" style="color:#065f46">🤖 AI 자동화</div><div class="d-value" style="color:#065f46">${f.aiNote}</div></div>` : '';
  document.getElementById('detail-grid').innerHTML = `
    <div class="detail-item"><div class="d-label">담당 부서</div><div class="d-value">${f.dept}</div></div>
    <div class="detail-item"><div class="d-label">담당 역할</div><div class="d-value">${f.name}</div></div>
    <div class="detail-item"><div class="d-label">주요 업무</div><div class="d-value">${f.desc.replace(/\n/g,'<br>')}</div></div>
    ${aiNote}
  `;
  panel.classList.add('show');
}

function renderSimulator(d) {
  const isMfg = currentInd === 'manufacturing';
  document.getElementById('mfg-module-bar').style.display = isMfg ? 'flex' : 'none';
  if (isMfg) {
    setMfgModule(currentMfgModule);
  } else {
    document.getElementById('sim-menu-path').textContent = d.simMenu;
    document.getElementById('sim-screen-name').textContent = d.simTitle;
    document.getElementById('btn-approve').style.display = d.approveShow ? '' : 'none';
    showQueryScreen(d);
    document.getElementById('ai-dashboard-card').style.display = 'none';
    document.getElementById('ai-bottom-row').style.display = 'none';
  }
}

function setMfgModule(key) {
  currentMfgModule = key;
  document.querySelectorAll('.mod-tab').forEach(t => t.classList.toggle('active', t.dataset.mod === key));
  const m = MFG_MODULES[key];
  document.getElementById('sim-menu-path').textContent = m.menu;
  document.getElementById('sim-screen-name').textContent = m.title;
  document.getElementById('btn-approve').style.display = m.approveShow ? '' : 'none';
  const synthD = {
    simMenu: m.menu, simTitle: m.title,
    simFields: m.fields, simItems: m.items,
    tableHeader: m.tableHeader, tableData: m.tableData,
    approveShow: m.approveShow,
  };
  if (key === 'quality') {
    showOQCScreen(MFG_MODULES.quality);
  } else {
    showQueryScreen(synthD);
  }
  renderTable(synthD);
  renderAISection(key);
}

  const body = document.getElementById('erp-sim-body');

function showInputScreen(d) {
  simMode = 'new';
  const body = document.getElementById('erp-sim-body');
  body.innerHTML = `
    <div class="mini-form" style="margin-bottom:12px">
      ${d.simFields.map(f=>`

function addCommas(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function simAction(act) {
  let d = INDUSTRIES[currentInd];
  if (currentInd === 'manufacturing') {
    const m = MFG_MODULES[currentMfgModule];
    d = {...d, simFields: m.fields, simItems: m.items, tableHeader: m.tableHeader, tableData: m.tableData};
  }
  if (act === 'new') { showInputScreen(d); toast('신규 입력 화면으로 전환되었습니다'); }
  else if (act === 'query') { showQueryScreen(d); toast('조회 완료 — ' + d.tableData.length + '건'); }
  else if (act === 'save') { toast('✅ 저장되었습니다 (시뮬레이션)'); }
  else if (act === 'print') { toast('🖨️ 인쇄 미리보기 — ERP 양식 에디터로 이동합니다'); setTimeout(()=>window.open('/','_blank'),1200); }
  else if (act === 'approve') { toast('✅ 승인 처리되었습니다 (시뮬레이션)'); }
}

  const pieTitles = {manufacturing:'ERP 모듈별 AI 자동화 구성비',construction:'현장별 공정 완료율',distribution:'출고 유형별 처리 비율',service:'프로젝트 유형별 수주 구성',food:'매장 유형별 매출 비중'};
  const el1 = document.getElementById('chart-trend-title'); if (el1) el1.textContent = trendTitles[currentInd] || '월별 핵심 지표';
  const el2 = document.getElementById('chart-pie-title'); if (el2) el2.textContent = pieTitles[currentInd] || '업무 자동화 구성비';

  // Trend chart
  if (trendChart) trendChart.destroy();
  const ctx1 = document.getElementById('chart-trend').getContext('2d');
  trendChart = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: d.trendLabel,
      datasets: [{
        label: d.trendName,
        data: d.trendData,
        backgroundColor: 'rgba(37,99,235,.7)',
        borderRadius: 5,
        borderSkipped: false,
      },{
        type:'line',
        label:'추세',
        data: d.trendData,
        borderColor:'#ef4444',
        borderWidth:2,
        pointRadius:3,
        pointBackgroundColor:'#ef4444',
        tension:.3,
        fill:false,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},
        x:{grid:{display:false},ticks:{font:{size:10}}}
      }
    }
  });

  // Pie chart
  if (pieChart) pieChart.destroy();
  const ctx2 = document.getElementById('chart-pie').getContext('2d');
  pieChart = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: d.pieLabels,
      datasets:[{
        data: d.pieData,
        backgroundColor:['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6'],
        borderWidth:2, borderColor:'#fff',
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:8}}
      },
      cutout:'55%'

function renderAlerts(d) {
  const icons = {warn:'⚠️',info:'ℹ️',ok:'✅',err:'🔴'};
  const colors = {warn:'#fef3c7',info:'#dbeafe',ok:'#d1fae5',err:'#fee2e2'};
  const borders = {warn:'#f59e0b',info:'#2563eb',ok:'#10b981',err:'#ef4444'};
  document.getElementById('alert-list').innerHTML = d.alerts.map(a=>`
    <div style="background:${colors[a.type]};border-left:3px solid ${borders[a.type]};border-radius:6px;padding:9px 12px;font-size:12px">
      ${icons[a.type]} ${a.msg}
    </div>
  `).join('');
}

let currentAiTab = 'scenario';

function setAiTab(tab) {
  currentAiTab = tab;
  document.querySelectorAll('.ai-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.ai-tab-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById('ai-tab-' + tab);
  if (panel) panel.style.display = '';
  if (tab === 'chart') renderAIKPIChart(currentMfgModule);
  if (tab === 'datatable') renderAIDataTable(currentMfgModule);
  if (tab === 'eis') startEISSim();
  else stopEISSim();
}

function parseMinutes(s) {
  if (!s || s === '실시간' || s === '자동' || s === '완전자동') return 0;
  const m = s.match(/\d+/); return m ? parseInt(m[0]) : 1;
}

    <div class="ai-chart-card"><div class="card-title" style="margin-bottom:10px">⏱️ AS-IS vs TO-BE 처리시간 절감</div><canvas id="c-time"></canvas></div>

function renderAIDataTable(moduleKey) {
  const ai = AI_MODULE_DATA[moduleKey];
  if (!ai) return;
  const avgRpa = Math.round(ai.rpaKpis.reduce((a,k)=>a+k.rpa,0)/ai.rpaKpis.length);
  const avgSaving = Math.round(ai.rpaKpis.reduce((a,k) => {
    const asis=parseMinutes(k.asIs), tobe=parseMinutes(k.toBe);
    return a + (asis>0?(asis-tobe)/asis*100:95);
  }, 0) / ai.rpaKpis.length);
  const rows = ai.rpaKpis.map((k,i) => {
    const asis=parseMinutes(k.asIs), tobe=parseMinutes(k.toBe);
    const saving = asis>0?Math.round((asis-tobe)/asis*100):95;
    const lvlCls = k.rpa>=80?'완료':k.rpa>=60?'진행':'대기';
    return `<tr><td>${i+1}</td><td><b>${k.step}</b></td><td>${k.label}</td>
      <td class="num" style="color:#ef4444">${k.asIs}</td><td class="num" style="color:#10b981">${k.toBe}</td>
      <td class="num improve">↓ ${saving}%</td>
      <td class="num">${k.rpa}% <span class="pct-bar" style="width:${Math.round(k.rpa*0.55)}px"></span></td>
      <td><span class="badge ${lvlCls}">${k.rpa>=80?'HIGH':k.rpa>=60?'MED':'LOW'}</span></td></tr>`;
  });
  document.getElementById('ai-datatable-wrap').innerHTML = `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 16px">
        <div style="font-size:9px;color:#064e3b;font-weight:800;text-transform:uppercase;letter-spacing:.06em">평균 RPA 자동화율</div>
        <div style="font-size:26px;font-weight:900;color:#065f46">${avgRpa}<span style="font-size:12px">%</span></div>
      </div>
      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 16px">
        <div style="font-size:9px;color:#1e3a8a;font-weight:800;text-transform:uppercase;letter-spacing:.06em">평균 처리시간 절감율</div>
        <div style="font-size:26px;font-weight:900;color:#1e40af">${avgSaving}<span style="font-size:12px">%</span></div>
      </div>
      <div style="flex:1;min-width:200px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 16px">
        <div style="font-size:9px;color:#78350f;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">적용 AI 기술 스택</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${ai.techs.map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="kpi-data-table">
        <thead><tr><th>#</th><th>업무 단계</th><th>AI 자동화 기술</th><th>AS-IS 시간</th><th>TO-BE 시간</th><th>절감율</th><th>자동화율</th><th>레벨</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>
    <div style="margin-top:14px;background:#f8fafc;border-radius:8px;padding:13px 16px;border:1px solid var(--border);font-size:12px;line-height:1.9;color:#334155">
      <b style="color:var(--c1)">📝 AI 구현 프로세스 설명</b><br>${ai.desc}
    </div>
  `;
}

// ══════════════════════════════════════════════
//  EIS 실시간 대시보드 (하루 100배속 시뮬레이션)
// ══════════════════════════════════════════════
function getEISSnap(min) {
  const p = Math.max(0, Math.min(1, (min - 540) / 540));
  const rnd = r => (Math.random() - 0.5) * r;
  const progress = Math.round(p * 100);
  const cfg = CASE_PROFILES[currentInd] || CASE_PROFILES.manufacturing;
  const tiles = cfg.eisTiles(p, rnd);
  const gauges = cfg.eisGauges(p, rnd);
  const todos = cfg.todos(min);
  const sched = cfg.sched;

  // 업종별 알림 자동 생성
  const alerts = [];
  const alertDefs = {
    manufacturing:[
      ()=>Math.round(88+rnd(6))<85 && {type:'warn',dept:'생산',msg:`설비 가동률 이상 — 즉시 확인 요망`},
      ()=>Math.round((1.8+rnd(0.5))*10)/10>2.0 && {type:'danger',dept:'품질',msg:`OQC 불량률 기준 초과 — 품질팀 조치 필요`},
      ()=>({type:'info',dept:'AI',msg:`RPA: 수주 ${Math.round(p*18+2)}건 자동 등록 · EDI 발주 ${Math.round(p*7)}건 발송`}),
      ()=>({type:'ok',dept:'구매',msg:`MRP 자동 실행 — 발주 ${Math.round(p*5+1)}건 생성`}),
      ()=>({type:'info',dept:'SVC',msg:`오늘 A/S 접수 ${Math.round(p*8+1)}건 · 처리완료 ${Math.round(p*6)}건`}),
    ],
    construction:[
      ()=>({type:'warn',dept:'현장',msg:`강남 오피스텔 현장 공정률 72% — 계획比 2%p 지연`}),
      ()=>({type:'info',dept:'구매',msg:`오늘 발주서 ${Math.round(p*47)}건 처리 · 전자발주 100%`}),
      ()=>({type:'ok',dept:'회계',msg:`기성청구 ${Math.round(p*8)}건 승인 완료`}),
      ()=>p>0.3&&{type:'warn',dept:'자재',msg:`레미콘 납기 D-2일 — 구매팀 확인 필요`},
      ()=>({type:'info',dept:'AI',msg:`협력사 정산 자동화: ${Math.round(p*23)}건 자동 정산 완료`}),
    ],
    distribution:[
      ()=>({type:'info',dept:'물류',msg:`출고 ${Math.round(p*3850)}건 처리 중 (진도 ${progress}%)`}),
      ()=>Math.random()>0.7&&{type:'warn',dept:'냉장',msg:`창고 B구역 온도 5.2°C — 점검 필요`},
      ()=>({type:'ok',dept:'WMS',msg:`재고 정확도 98.7% — 실시간 모니터링 정상`}),
      ()=>({type:'warn',dept:'반품',msg:`반품 대기 ${Math.round(12-p*8+rnd(3))}건 — 처리 요망`}),
      ()=>({type:'info',dept:'AI',msg:`자동 재발주 ${Math.round(p*28)}건 생성 · EDI 발송 완료`}),
    ],
    service:[
      ()=>({type:'warn',dept:'PMO',msg:`C사 MES 예산 소진율 78% — 범위 조정 검토 필요`}),
      ()=>({type:'info',dept:'인사',msg:`오늘 M/M 투입 ${Math.round(p*45+5)}건 자동 집계`}),
      ()=>({type:'ok',dept:'영업',msg:`B사 SCM 고도화 검수 완료 — 세금계산서 발행 예정`}),
      ()=>p>0.5&&{type:'info',dept:'AI',msg:`프로젝트 수익률 AI 예측: 평균 ${Math.round(18.5+rnd(1))}%`},
    ],
    food:[
      ()=>({type:'ok',dept:'POS',msg:`142개 매장 식재료 자동발주 ${Math.round(p*142)}건 완료`}),
      ()=>Math.random()>0.6&&{type:'warn',dept:'품질',msg:`건대 5호점 원가율 35.2% — 목표 초과`},
      ()=>({type:'info',dept:'AI',msg:`유통기한 임박 식재료 ${Math.round(3+rnd(2))}건 자동 알림 발송`}),
      ()=>({type:'info',dept:'매출',msg:`실시간 매출: 오늘 ${Math.round(p*6200+rnd(200))}만원`}),
      ()=>({type:'ok',dept:'위생',msg:`일일 위생점검 AI 체크 완료 — 이상 없음`}),
    ],
  };
  const defs = alertDefs[currentInd] || alertDefs.manufacturing;
  defs.forEach(fn => { const a = fn(); if (a) alerts.push(a); });

  return {tiles, gauges, todos, sched, alerts, progress,
    salesCfg: cfg, p};
}

function startEISSim() {
  if (!document.getElementById('eis-dashboard')) return;
  stopEISSim();
  eisSimMinutes = Math.round((new Date().getHours() * 60 + new Date().getMinutes()));
  if (eisSimMinutes < 9*60) eisSimMinutes = 9*60;
  if (eisSimMinutes > 18*60) eisSimMinutes = 18*60;
  renderEISDashboard();
}

function eisRefresh() {
  eisSimMinutes += Math.round(Math.random()*30+15);
  if (eisSimMinutes > 18*60) eisSimMinutes = 9*60;
  renderEISDashboard();
  const btn = document.querySelector('.eis-refresh-btn');
  if (btn) { btn.textContent = '🔄 업데이트 중...'; setTimeout(()=>{btn.textContent='🔄 데이터 업데이트';},800); }
}

function stopEISSim() {
  if (eisTimer) { clearInterval(eisTimer); eisTimer = null; }
  ['eis-sales','eis-trend'].forEach(k => { if (eisCharts[k]) { eisCharts[k].destroy(); delete eisCharts[k]; } });
}

function setEisTrend(period) {
  eisTrendPeriod = period;
  document.querySelectorAll('.eis-trend-btn').forEach(b => b.classList.toggle('active', b.dataset.p === period));
  renderEISTrendChart();
}

function toggleEisTodo(id) {
  eisTodoState[id] = !eisTodoState[id];
  const cb = document.getElementById('todo-cb-' + id);
  if (cb) { cb.classList.toggle('done', eisTodoState[id]); cb.textContent = eisTodoState[id] ? '✓' : ''; }
  const label = document.getElementById('todo-label-' + id);
  if (label) label.style.cssText = eisTodoState[id] ? 'text-decoration:line-through;color:var(--muted)' : '';
}

function renderEISDashboard() {
  const el = document.getElementById('eis-dashboard');
  if (!el) return;
  ['eis-sales','eis-trend'].forEach(k => { if (eisCharts[k]) { eisCharts[k].destroy(); delete eisCharts[k]; } });

  const snap = getEISSnap(eisSimMinutes);
  const hh = String(Math.floor(eisSimMinutes/60)).padStart(2,'0');
  const mm = String(eisSimMinutes%60).padStart(2,'0');
  const alertDot = {ok:'#10b981',info:'#2563eb',warn:'#f59e0b',danger:'#ef4444'};

  const { todos, sched } = snap;
  todos.forEach(t => { if (eisTodoState[t.id] === undefined) eisTodoState[t.id] = t.auto !== undefined ? t.auto : false; });

  el.innerHTML = `
    <div class="eis-header">
      <div>
        <div class="eis-clock-label">시뮬레이션 시각 (100배속)</div>
        <div class="eis-clock">${hh}:${mm}</div>
      </div>
      <div style="flex:1;padding:0 16px;min-width:140px">
        <div style="font-size:9px;color:#64748b;font-weight:700;margin-bottom:4px">업무 진행률 (09:00→18:00)</div>
        <div style="height:7px;background:#1e3a5f;border-radius:4px;overflow:hidden">
          <div style="width:${snap.progress}%;height:100%;background:linear-gradient(90deg,#10b981,#2563eb);transition:width .8s ease"></div>
        </div>
        <div style="font-size:9px;color:#475569;margin-top:3px">${snap.progress}% 경과</div>
      </div>
      <div style="text-align:right">
        <button class="eis-refresh-btn" onclick="eisRefresh()" style="background:#10b98120;border:1px solid #10b98140;color:#34d399;padding:4px 14px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🔄 데이터 업데이트</button>
      </div>
    </div>

    <div class="eis-kpi-row">
      ${snap.tiles.map(k=>`
        <div class="eis-kpi" style="border-top-color:${k.c}">
          <span class="ek-badge ${k.badge}">${k.bl}</span>
          <div class="ek-label">${k.label}</div>
          <div class="ek-val">${k.val}<span style="font-size:11px">${k.unit}</span></div>
          <div class="ek-sub">${k.sub}</div>
        </div>`).join('')}
    </div>

    <div class="eis-mid-grid">
      <div class="eis-panel">
        <div class="eis-panel-title">🔔 알림 · 경고 · 정보</div>
        ${snap.alerts.slice(0,6).map(a=>`
          <div class="eis-alert-item">
            <div class="eis-alert-dot" style="background:${alertDot[a.type]}"></div>
            <div><span style="font-size:9px;font-weight:700;color:${alertDot[a.type]}">[${a.dept}]</span> ${a.msg}</div>
          </div>`).join('')}
      </div>
      <div class="eis-panel">
        <div class="eis-panel-title">✅ 오늘 할일 (TO-DO)</div>
        ${todos.map(t=>`
          <div class="eis-todo-item" onclick="toggleEisTodo('${t.id}')">
            <div class="eis-todo-cb ${eisTodoState[t.id]?'done':''}" id="todo-cb-${t.id}">${eisTodoState[t.id]?'✓':''}</div>
            <span id="todo-label-${t.id}" style="${eisTodoState[t.id]?'text-decoration:line-through;color:var(--muted)':''}">${t.text}</span>
          </div>`).join('')}
      </div>
      <div class="eis-panel">
        <div class="eis-panel-title">📅 오늘 일정</div>
        ${sched.map(s=>{
          const sMin = parseInt(s.time)*60 + parseInt(s.time.split(':')[1]);
          const past = eisSimMinutes > sMin+30;
          const active = !past && Math.abs(eisSimMinutes-sMin)<30;
          const c = active?'var(--c2)':past?'#cbd5e1':'var(--c1)';
          return `<div class="eis-sched-item" style="border-color:${c}">
            <div class="eis-sched-time" style="color:${c}">${s.time} ${active?'▶ 진행중':past?'✓ 완료':''}</div>
            <div style="${past?'color:var(--muted)':''}">${s.title}</div>
            <div style="font-size:9px;color:var(--muted)">${s.place}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="eis-bottom-grid">
      <div class="eis-chart-box">
        <div class="card-title" style="margin-bottom:10px">📊 영업계획 vs 실적 · 이익예측</div>
        <canvas id="chart-eis-sales" style="width:100%!important;height:170px!important"></canvas>
      </div>
      <div class="eis-chart-box">
        <div class="card-title" style="margin-bottom:10px">💰 원가 · 이익 · 운영 지표 게이지</div>
        <div class="eis-gauge-row">
          ${snap.gauges.map(g=>`
            <div class="eis-gauge">
              <div class="eis-gauge-label">${g.label}</div>
              <div>
                <div style="font-size:8px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px"><span>0</span><span>목표 ${g.budget}%</span><span>${g.max}%</span></div>
                <div class="eis-gauge-bar"><div class="eis-gauge-fill" style="width:${Math.min(100,g.val/g.max*100).toFixed(1)}%;background:${g.c}"></div></div>
              </div>
              <div class="eis-gauge-pct" style="color:${g.c}">${g.val}%</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="eis-chart-box">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
        <div class="card-title" style="margin:0">📈 주/월/분기/반기/연간 흐름 · 사이클 추이 분석</div>
        <div class="eis-trend-tabs">
          ${[['week','주간'],['month','월간'],['quarter','분기'],['half','반기'],['year','연간']].map(([p,l])=>
            `<button class="eis-trend-btn ${eisTrendPeriod===p?'active':''}" data-p="${p}" onclick="setEisTrend('${p}')">${l}</button>`).join('')}
        </div>
      </div>
      <canvas id="chart-eis-trend" style="width:100%!important;height:190px!important"></canvas>
    </div>
  `;

  setTimeout(() => { renderEISSalesChart(snap); renderEISTrendChart(); }, 60);
}

function renderEISSalesChart(snap) {
  const el = document.getElementById('chart-eis-sales');
  if (!el) return;
  const sc = snap.salesCfg || CASE_PROFILES.manufacturing;
  const months = sc.salesMonths;
  const plan = sc.salesPlan;
  const lastPlan = plan[plan.length - 1] || 500;
  const actual = sc.salesActual.map((v, i) =>
    i === months.length - 1 ? Math.round(lastPlan * snap.p * 0.97) : v
  );
  const profitRate = {manufacturing:0.128,construction:0.058,distribution:0.052,service:0.185,food:0.128}[currentInd] || 0.128;
  const profit = actual.map(v => Math.round(v * profitRate));
  eisCharts['eis-sales'] = new Chart(el.getContext('2d'), {
    type:'bar',
    data:{labels:months, datasets:[
      {label:'영업계획',data:plan,backgroundColor:'rgba(37,99,235,.2)',borderColor:'#2563eb',borderWidth:1.5,borderRadius:3},
      {type:'line',label:'영업실적',data:actual,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.08)',fill:true,tension:.3,borderWidth:2,pointRadius:3,pointBackgroundColor:'#10b981'},
      {type:'line',label:'이익예측',data:profit,borderColor:'#8b5cf6',borderDash:[4,3],borderWidth:1.5,pointRadius:2,fill:false,tension:.3},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10}},
        title:{display:!!sc.salesLabel,text:sc.salesLabel||'',font:{size:10},color:'#64748b'}},
      scales:{y:{grid:{color:'#f8fafc'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}
  });
}

function renderEISTrendChart() {
  const el = document.getElementById('chart-eis-trend');
  if (!el) return;
  if (eisCharts['eis-trend']) { eisCharts['eis-trend'].destroy(); delete eisCharts['eis-trend']; }
  const cfgs = {
    week:{labels:['월','화','수','목','금','토','일'],sets:[
      {l:'매출',d:[45,52,48,61,58,42,35],c:'#2563eb'},{l:'원가',d:[17,19,18,22,20,15,13],c:'#ef4444'},{l:'이익',d:[5.2,6.8,6.1,8.5,7.9,5.5,4.8],c:'#10b981'}]},
    month:{labels:['1월','2월','3월','4월','5월','6월','7월'],sets:[
      {l:'매출',d:[410,448,492,487,508,516,498],c:'#2563eb'},{l:'원가',d:[155,168,185,178,190,194,185],c:'#ef4444'},{l:'이익',d:[52,58,64,63,68,70,66],c:'#10b981'}]},
    quarter:{labels:['1Q','2Q','3Q(예측)','4Q(예측)'],sets:[
      {l:'매출',d:[1350,1508,1542,1620],c:'#2563eb'},{l:'원가',d:[508,564,580,607],c:'#ef4444'},{l:'이익',d:[174,196,203,216],c:'#10b981'}]},
    half:{labels:['상반기','하반기(예)','전년上','전년下'],sets:[
      {l:'매출',d:[2858,3162,2540,2820],c:'#2563eb'},{l:'원가',d:[1072,1185,980,1085],c:'#ef4444'},{l:'이익',d:[370,418,318,368],c:'#10b981'}]},
    year:{labels:['2021','2022','2023','2024','2025','2026(예)'],sets:[
      {l:'매출',d:[4850,5200,5580,5920,6100,6318],c:'#2563eb'},{l:'원가',d:[1940,2050,2150,2250,2280,2362],c:'#ef4444'},{l:'이익',d:[612,686,738,802,850,908],c:'#10b981'}]},
  };
  const cfg = cfgs[eisTrendPeriod];
  eisCharts['eis-trend'] = new Chart(el.getContext('2d'), {
    type:'line',
    data:{labels:cfg.labels, datasets:cfg.sets.map(d=>({
      label:d.l, data:d.d, borderColor:d.c, backgroundColor:d.c+'18',
      fill:d.l==='이익', tension:.35, borderWidth:2, pointRadius:3, pointBackgroundColor:d.c,
    }))},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10}}},
      scales:{y:{grid:{color:'#f8fafc'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}
  });
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════
render();
</script>
</body>
</html>
