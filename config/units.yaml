# PKG 사업본부(구축) 유닛 설정
units:
  - id: "PM"
    name: "PM 유닛"
    description: "프로젝트 관리 및 일정 통제"
    head: "PM 유닛장"
    key_insights:
      - "프로젝트 진행률 (%)"
      - "마일스톤 달성 현황"
      - "리스크 항목 수 및 등급"
      - "이슈 해결률"
      - "일정 준수율 (%)"
    weekly_items:
      - "주간 진행 현황"
      - "금주 완료 작업"
      - "차주 계획"
      - "현안 및 리스크"
    monthly_items:
      - "월간 진행률 요약"
      - "마일스톤 달성 결과"
      - "리스크 관리 현황"
      - "자원 투입 현황"
      - "차월 계획"

  - id: "DEV"
    name: "개발 유닛"
    description: "소프트웨어 개발 및 구현"
    head: "개발 유닛장"
    key_insights:
      - "개발 완료율 (%)"
      - "코드 리뷰 건수"
      - "버그 발생/해결 건수"
      - "기술 부채 항목"
      - "배포 횟수"
    weekly_items:
      - "개발 진행 현황"
      - "금주 완료 기능"
      - "버그/이슈 현황"
      - "차주 개발 계획"
    monthly_items:
      - "월간 개발 완료 현황"
      - "품질 지표 (버그율, 커버리지)"
      - "기술 부채 현황"
      - "아키텍처 변경 사항"
      - "차월 개발 로드맵"

  - id: "INFRA"
    name: "인프라 유닛"
    description: "서버, 네트워크, 클라우드 인프라 구축"
    head: "인프라 유닛장"
    key_insights:
      - "인프라 구축 완료율 (%)"
      - "시스템 가동률 (%)"
      - "보안 취약점 건수"
      - "장애 발생/복구 시간"
      - "비용 집행률 (%)"
    weekly_items:
      - "인프라 구축 현황"
      - "시스템 운영 현황"
      - "보안 점검 결과"
      - "차주 작업 계획"
    monthly_items:
      - "월간 인프라 구축 현황"
      - "시스템 안정성 지표"
      - "보안 감사 결과"
      - "비용 집행 현황"
      - "차월 인프라 계획"

  - id: "QA"
    name: "품질보증 유닛"
    description: "테스트 및 품질 관리"
    head: "QA 유닛장"
    key_insights:
      - "테스트 완료율 (%)"
      - "결함 발견/해결 건수"
      - "테스트 케이스 수"
      - "품질 목표 달성률 (%)"
      - "회귀 테스트 통과율 (%)"
    weekly_items:
      - "테스트 진행 현황"
      - "발견 결함 현황"
      - "품질 지표 요약"
      - "차주 테스트 계획"
    monthly_items:
      - "월간 품질 현황 요약"
      - "결함 분석 및 트렌드"
      - "테스트 커버리지 현황"
      - "품질 목표 달성 여부"
      - "차월 품질 계획"

  - id: "BIZ"
    name: "영업/사업관리 유닛"
    description: "영업, 계약, 사업 관리"
    head: "사업관리 유닛장"
    key_insights:
      - "수주 목표 달성률 (%)"
      - "매출 집행률 (%)"
      - "계약 변경 건수"
      - "고객 만족도"
      - "추가 수주 가능성"
    weekly_items:
      - "영업 활동 현황"
      - "계약/변경 현황"
      - "고객 이슈 및 요청"
      - "차주 영업 계획"
    monthly_items:
      - "월간 수주/매출 현황"
      - "계약 이행 현황"
      - "고객 관계 관리 현황"
      - "사업 리스크 현황"
      - "차월 사업 계획"

  - id: "SUPPORT"
    name: "지원 유닛"
    description: "행정, 인력, 자원 지원"
    head: "지원 유닛장"
    key_insights:
      - "자원 투입 효율 (%)"
      - "인력 가동률 (%)"
      - "예산 집행률 (%)"
      - "지원 요청 처리율 (%)"
      - "교육/훈련 이수율 (%)"
    weekly_items:
      - "인력/자원 현황"
      - "지원 요청 처리 현황"
      - "예산 집행 현황"
      - "차주 지원 계획"
    monthly_items:
      - "월간 인력 운영 현황"
      - "예산 집행 현황 및 전망"
      - "교육 이수 현황"
      - "행정 처리 현황"
      - "차월 지원 계획"
