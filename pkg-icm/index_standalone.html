<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PKG 구축통합관리 — Douzone Bizon PKG사업본부</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   PKG 구축통합관리 (PKG-ICM)
   디자인 토큰 — PKG Weekly OnePageScroll v70 컬러톤 계승
   ══════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root{
  /* Base */
  --bg:#FFFFFF;
  --bg-page:#F5F7FA;
  --bg-card:#FFFFFF;
  /* Text */
  --tx-h:#1A2035;
  --tx-b:#374151;
  --tx-s:#6B7280;
  --tx-m:#9CA3AF;
  /* Border */
  --bd-light:#E8EDF3;
  --bd-mid:#D1D9E6;

  /* ── Pillar 색조 (Weekly v70 파스텔 계열) ───────────────────── */
  --p1-bg:#F2FBF6; --p1-acc:#16A34A; --p1-mid:#BBF7D0;  /* Delivery — 민트그린 */
  --p2-bg:#F0FAFB; --p2-acc:#0891B2; --p2-mid:#A5F3FC;  /* Margin — 시안 */
  --p3-bg:#F0F7FF; --p3-acc:#2563EB; --p3-mid:#BFDBFE;  /* 표준화 — 하늘 */
  --p4-bg:#EEF2FF; --p4-acc:#4F46E5; --p4-mid:#A5B4FC;  /* 생산성 — 퍼플블루 */
  --p5-bg:#FAF5FF; --p5-acc:#7C3AED; --p5-mid:#DDD6FE;  /* 고객성과 — 라벤더 */
  --p6-bg:#FFF5F5; --p6-acc:#DC2626; --p6-mid:#FECACA;  /* 품질리스크 — 로즈 */
  --p7-bg:#F5F3FF; --p7-acc:#5B21B6; --p7-mid:#C4B5FD;  /* AI전환 — 인디고 */

  /* 상태 강조 */
  --ok:#16A34A;   --ok-bg:#F0FDF4;
  --warn:#D97706; --warn-bg:#FFFBEB;
  --risk:#DC2626; --risk-bg:#FFF5F5;
  --info:#2563EB; --info-bg:#EFF6FF;
  --idle:#6B7280; --idle-bg:#F3F4F6;

  /* 레이아웃 */
  --nav-h:56px;
  --radius:12px;
  --shadow-sm:0 1px 3px rgba(16,24,40,.06);
  --shadow:0 2px 10px rgba(16,24,40,.07);
  --shadow-lg:0 10px 28px rgba(16,24,40,.13);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  background:var(--bg-page); color:var(--tx-b);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}

/* ── 앱 헤더 ─────────────────────────────────────────────────── */
.app-header{
  background:linear-gradient(120deg,#1A2035 0%,#2B3560 55%,#3B4FC8 100%);
  color:#fff; padding:1.05rem 1.75rem;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  box-shadow:0 3px 14px rgba(26,32,53,.22);
}
.app-header .brand h1{font-size:1.22rem;font-weight:900;letter-spacing:-.4px}
.app-header .brand p{font-size:.74rem;color:rgba(255,255,255,.72);margin-top:.15rem;font-weight:500}
.header-meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.26);
  border-radius:999px; padding:.28rem .8rem; font-size:.72rem; font-weight:700; white-space:nowrap;
}
.chip.live{background:rgba(22,163,74,.28);border-color:rgba(134,239,172,.5)}

/* ── 네비게이션 ──────────────────────────────────────────────── */
.nav{
  background:var(--bg); border-bottom:1px solid var(--bd-light);
  display:flex; gap:0; padding:0 1.5rem; overflow-x:auto;
  position:sticky; top:0; z-index:90; box-shadow:var(--shadow-sm);
}
.nav::-webkit-scrollbar{height:0}
.nav-btn{
  padding:.85rem 1.15rem; border:none; background:transparent; cursor:pointer;
  font-family:inherit; font-size:.83rem; font-weight:700; color:var(--tx-s);
  border-bottom:3px solid transparent; white-space:nowrap; transition:all .18s;
}
.nav-btn:hover{color:var(--tx-h);background:#FAFBFD}
.nav-btn.active{color:#3B4FC8;border-bottom-color:#3B4FC8}

/* ── 컨테이너 / 뷰 ───────────────────────────────────────────── */
.wrap{max-width:1460px;margin:0 auto;padding:1.4rem 1.75rem 3rem}
.view{display:none}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 섹션 헤더 ───────────────────────────────────────────────── */
.sec-head{display:flex;align-items:baseline;gap:.7rem;margin:0 0 .9rem;flex-wrap:wrap}
.sec-head h2{font-size:1.02rem;font-weight:900;color:var(--tx-h);letter-spacing:-.3px}
.sec-head .sub{font-size:.76rem;color:var(--tx-s);font-weight:500}
.sec-head .spacer{flex:1}

/* ── 카드 ────────────────────────────────────────────────────── */
.card{
  background:var(--bg-card); border:1px solid var(--bd-light);
  border-radius:var(--radius); padding:1.25rem 1.4rem; box-shadow:var(--shadow-sm);
}
.card + .card{margin-top:1rem}

/* ── Executive KPI 카드 ──────────────────────────────────────── */
.exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:.9rem;margin-bottom:1.4rem}
.exec-card{
  background:var(--bg-card); border:1px solid var(--bd-light); border-top:4px solid var(--acc,#3B4FC8);
  border-radius:var(--radius); padding:1.05rem 1.15rem; box-shadow:var(--shadow-sm);
  transition:transform .18s, box-shadow .18s;
}
.exec-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.exec-card .k-name{font-size:.72rem;font-weight:800;color:var(--tx-s);letter-spacing:.2px;margin-bottom:.4rem}
.exec-card .k-val{font-size:1.85rem;font-weight:900;color:var(--acc,#3B4FC8);line-height:1.05;letter-spacing:-1px}
.exec-card .k-val .unit{font-size:.9rem;font-weight:700;margin-left:.12rem}
.exec-card .k-meta{font-size:.72rem;color:var(--tx-m);margin-top:.35rem;font-weight:500}
.exec-card .k-target{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin-top:.6rem;padding-top:.55rem;border-top:1px dashed var(--bd-light);
  font-size:.7rem;font-weight:700;color:var(--tx-s);
}

/* ── 진행 바 ─────────────────────────────────────────────────── */
.bar{height:6px;background:#EDF0F5;border-radius:99px;overflow:hidden;margin-top:.5rem}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--acc,#3B4FC8);transition:width .6s cubic-bezier(.22,1,.36,1)}

/* ── 판정 배지 ───────────────────────────────────────────────── */
.judge{padding:.14rem .5rem;border-radius:6px;font-size:.68rem;font-weight:800;white-space:nowrap}
.judge.ok{background:var(--ok-bg);color:var(--ok)}
.judge.warn{background:var(--warn-bg);color:var(--warn)}
.judge.risk{background:var(--risk-bg);color:var(--risk)}
.judge.idle{background:var(--idle-bg);color:var(--idle)}

/* ── 산출상태 배지 ───────────────────────────────────────────── */
.st{padding:.12rem .48rem;border-radius:5px;font-size:.65rem;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.st.auto{background:#ECFDF5;color:#047857;border:1px solid #A7F3D0}
.st.proxy{background:#FFFBEB;color:#B45309;border:1px solid #FDE68A}
.st.pending{background:#F3F4F6;color:#6B7280;border:1px solid #E5E7EB}

/* ── Pillar 섹션 ─────────────────────────────────────────────── */
.pillar{margin-bottom:1.5rem;border-radius:var(--radius);overflow:hidden;border:1px solid var(--bd-light);box-shadow:var(--shadow-sm)}
.pillar-head{
  background:var(--pbg); border-bottom:1px solid var(--bd-light);
  padding:.85rem 1.25rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
}
.pillar-head .no{
  width:26px;height:26px;border-radius:8px;background:var(--pacc);color:#fff;
  display:grid;place-items:center;font-size:.78rem;font-weight:900;flex-shrink:0;
}
.pillar-head h3{font-size:.95rem;font-weight:900;color:var(--tx-h)}
.pillar-head .en{font-size:.72rem;color:var(--pacc);font-weight:800;letter-spacing:.3px}
.pillar-head .desc{font-size:.73rem;color:var(--tx-s);width:100%;font-weight:500}
.pillar-body{background:var(--bg-card);padding:1rem 1.25rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:.85rem}

/* ── KPI 카드 (Definition Book) ──────────────────────────────── */
.kpi{border:1px solid var(--bd-light);border-radius:10px;padding:.9rem 1rem;background:#FCFDFE;transition:box-shadow .18s,border-color .18s}
.kpi:hover{box-shadow:var(--shadow);border-color:var(--pmid)}
.kpi-top{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.kpi-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;font-weight:800;color:var(--pacc);flex-shrink:0;padding-top:.1rem}
.kpi-name{font-size:.85rem;font-weight:800;color:var(--tx-h);flex:1;line-height:1.35}
.kpi-star{color:#F59E0B;font-size:.78rem}
.kpi-formula{
  background:#F8FAFC;border:1px solid var(--bd-light);border-left:3px solid var(--pacc);
  border-radius:6px;padding:.5rem .65rem;margin:.45rem 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.71rem;color:#334155;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.kpi-row{display:flex;justify-content:space-between;gap:.6rem;font-size:.72rem;padding:.2rem 0}
.kpi-row .lb{color:var(--tx-m);font-weight:700;flex-shrink:0}
.kpi-row .vl{color:var(--tx-b);text-align:right;font-weight:500}
.kpi-result{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--bd-light);
}
.kpi-result .now{font-size:1.25rem;font-weight:900;color:var(--pacc);letter-spacing:-.5px}
.kpi-result .now.na{font-size:.8rem;color:var(--tx-m);font-weight:700}
.kpi-note{font-size:.68rem;color:var(--tx-m);margin-top:.45rem;line-height:1.5;padding-left:.5rem;border-left:2px solid var(--bd-light)}

/* ── 검색 / 필터 ─────────────────────────────────────────────── */
.filters{background:var(--bg-card);border:1px solid var(--bd-light);border-radius:var(--radius);padding:1rem 1.15rem;margin-bottom:1rem;box-shadow:var(--shadow-sm)}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:.7rem}
.fg label{display:block;font-size:.7rem;font-weight:800;color:var(--tx-s);margin-bottom:.3rem}
.ctl{
  width:100%;padding:.52rem .7rem;border:1.5px solid var(--bd-light);border-radius:8px;
  font-family:inherit;font-size:.8rem;background:#FBFCFE;color:var(--tx-b);transition:border-color .18s,background .18s;
}
.ctl:focus{outline:none;border-color:#3B4FC8;background:#fff}
.f-info{margin-top:.7rem;font-size:.74rem;color:var(--tx-s);font-weight:600;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}

/* ── 테이블 ──────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bd-light)}
table{width:100%;border-collapse:collapse;font-size:.77rem;background:#fff}
thead th{
  background:#F7F9FC;padding:.6rem .7rem;text-align:left;font-weight:800;font-size:.69rem;
  color:var(--tx-s);letter-spacing:.2px;border-bottom:1.5px solid var(--bd-mid);white-space:nowrap;
  position:sticky;top:0;z-index:2;
}
tbody td{padding:.52rem .7rem;border-bottom:1px solid #F1F4F8;vertical-align:middle}
tbody tr:hover td{background:#FAFBFD}
tbody tr.sel td{background:#EEF2FF}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.73rem}
.strong{font-weight:800;color:var(--tx-h)}

/* ── 상태 배지 ───────────────────────────────────────────────── */
.bdg{display:inline-block;padding:.13rem .5rem;border-radius:999px;font-size:.66rem;font-weight:800;white-space:nowrap}
.bdg.완료{background:#DCFCE7;color:#15803D}
.bdg.진행{background:#DBEAFE;color:#1D4ED8}
.bdg.지연{background:#FEE2E2;color:#B91C1C}
.bdg.보류{background:#FEF9C3;color:#A16207}
.bdg.반품{background:#FAE8FF;color:#86198F}

/* ── 마스터-디테일 ───────────────────────────────────────────── */
.md-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.md-master{max-height:340px;overflow:auto;border-radius:10px;border:1px solid var(--bd-light)}
.detail-tabs{display:flex;gap:.3rem;border-bottom:1.5px solid var(--bd-light);margin-bottom:.9rem;overflow-x:auto;padding-bottom:0}
.dt-btn{
  padding:.5rem .85rem;border:none;background:transparent;cursor:pointer;font-family:inherit;
  font-size:.76rem;font-weight:700;color:var(--tx-s);border-bottom:2.5px solid transparent;white-space:nowrap;
}
.dt-btn:hover{color:var(--tx-h)}
.dt-btn.active{color:#3B4FC8;border-bottom-color:#3B4FC8}
.dt-pane{display:none}
.dt-pane.active{display:block}

/* ── 필드 그리드 ─────────────────────────────────────────────── */
.fld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem 1.1rem}
.fld{border-bottom:1px dotted var(--bd-light);padding-bottom:.4rem}
.fld .l{font-size:.67rem;font-weight:800;color:var(--tx-m);letter-spacing:.2px;margin-bottom:.15rem}
.fld .v{font-size:.83rem;font-weight:700;color:var(--tx-h)}
.fld .v.na{color:var(--tx-m);font-weight:500;font-style:italic}

/* ── 공수 카드 ───────────────────────────────────────────────── */
.md-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:.65rem;margin:.9rem 0}
.md-card{border-radius:10px;padding:.75rem .85rem;text-align:center;border:1px solid var(--bd-light)}
.md-card .l{font-size:.68rem;color:var(--tx-s);font-weight:700;margin-bottom:.25rem}
.md-card .v{font-size:1.2rem;font-weight:900;letter-spacing:-.5px}
.md-card.c1{background:#EFF6FF}.md-card.c1 .v{color:#2563EB}
.md-card.c2{background:#F0FDF4}.md-card.c2 .v{color:#16A34A}
.md-card.c3{background:#FFF7ED}.md-card.c3 .v{color:#EA580C}
.md-card.c4{background:#F5F3FF}.md-card.c4 .v{color:#7C3AED}
.md-card.c5{background:#F0FAFB}.md-card.c5 .v{color:#0891B2}

/* ── 미구현 안내 ─────────────────────────────────────────────── */
.notimpl{
  background:var(--idle-bg);border:1px dashed var(--bd-mid);border-radius:10px;
  padding:1.1rem 1.25rem;color:var(--tx-s);font-size:.78rem;line-height:1.7;
}
.notimpl b{color:var(--tx-h);font-weight:800}
.notimpl .sch{
  margin-top:.6rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.71rem;
  color:#475569;background:#fff;border:1px solid var(--bd-light);border-radius:6px;padding:.55rem .7rem;line-height:1.75;
}

/* ── 막대 차트 (그룹 막대) ───────────────────────────────────── */
.chart{display:flex;align-items:stretch;gap:6px;height:186px;padding-top:.4rem}
.chart .col{flex:1;display:flex;flex-direction:column;min-width:0}
.chart .col .v{font-size:.61rem;font-weight:800;color:#3B4FC8;text-align:center;height:14px;line-height:14px}
.chart .col .bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.chart .col .bars .b{
  flex:1;max-width:15px;border-radius:3px 3px 0 0;min-height:2px;
  background:linear-gradient(180deg,#6366F1,#3B4FC8);transition:height .6s cubic-bezier(.22,1,.36,1);
}
.chart .col .bars .b.done{background:linear-gradient(180deg,#4ADE80,#16A34A)}
.chart .col .l{font-size:.6rem;color:var(--tx-m);font-weight:600;white-space:nowrap;text-align:center;padding-top:5px;border-top:1px solid var(--bd-light);margin-top:2px}
.chart-legend{display:flex;gap:1.1rem;justify-content:center;margin-top:.7rem;font-size:.7rem;color:var(--tx-s);font-weight:700}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:.25rem}

/* ── 랭크 바 (부서/유형별) ───────────────────────────────────── */
.rank{margin-bottom:.6rem}
.rank .rh{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.25rem;gap:.5rem}
.rank .rh .n{font-weight:800;color:var(--tx-h)}
.rank .rh .s{color:var(--tx-s);font-weight:600;font-size:.72rem}

/* ── 페이지네이션 ────────────────────────────────────────────── */
.pager{display:flex;justify-content:center;align-items:center;gap:.35rem;padding:.9rem 0;flex-wrap:wrap}
.pg{padding:.35rem .7rem;border:1.5px solid var(--bd-light);background:#fff;border-radius:7px;font-family:inherit;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--tx-b);transition:all .15s}
.pg:hover:not(:disabled){background:#3B4FC8;color:#fff;border-color:#3B4FC8}
.pg.active{background:#3B4FC8;color:#fff;border-color:#3B4FC8}
.pg:disabled{opacity:.38;cursor:not-allowed}

/* ── 2단 그리드 ──────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem;margin-bottom:1rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:1rem}

/* ── 로딩 / 에러 ─────────────────────────────────────────────── */
.loading{text-align:center;padding:4rem 1rem;color:var(--tx-s)}
.loading .sp{
  width:34px;height:34px;border:3px solid var(--bd-light);border-top-color:#3B4FC8;
  border-radius:50%;margin:0 auto .9rem;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:var(--risk-bg);border:1px solid #FECACA;color:#991B1B;border-radius:var(--radius);padding:1.4rem 1.6rem;font-size:.84rem;line-height:1.8}
.err b{display:block;font-size:.95rem;margin-bottom:.4rem;font-weight:900}
.err code{background:#fff;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;border:1px solid #FECACA}

/* ── 푸터 ────────────────────────────────────────────────────── */
.foot{background:#1A2035;color:#8A93A8;text-align:center;padding:1.15rem;font-size:.73rem;line-height:1.7}
.foot b{color:#C7D2FE;font-weight:700}

/* ── 스크롤바 ────────────────────────────────────────────────── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#F1F4F8}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}

/* ── 반응형 ──────────────────────────────────────────────────── */
@media(max-width:820px){
  .wrap{padding:1rem .9rem 2rem}
  .app-header{padding:.85rem 1rem;flex-direction:column;align-items:flex-start}
  .nav{padding:0 .5rem}
  .pillar-body{grid-template-columns:1fr}
  .exec-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media print{
  .nav,.pager,.filters{display:none!important}
  .view{display:block!important}
  body{background:#fff}
}

</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>PKG 구축통합관리</h1>
    <p>Douzone Bizon · PKG사업본부 · A10 구축업무 통합 관리지표 플랫폼</p>
  </div>
  <div class="header-meta" id="meta">
    <span class="chip">데이터 로딩 중…</span>
  </div>
</header>

<nav class="nav" id="nav"></nav>

<main class="wrap" id="boot">
  <div class="view active" id="v-exec"><div class="loading"><div class="sp"></div>KPI 산출 중…</div></div>
  <div class="view" id="v-book"></div>
  <div class="view" id="v-project"></div>
  <div class="view" id="v-status"></div>
  <div class="view" id="v-capa"></div>
  <div class="view" id="v-bench"></div>
</main>

<footer class="foot">

<script>
/* ===== js/data.js ===== */
/* ══════════════════════════════════════════════════════════════════
   PKG 구축통합관리 — 데이터 정규화 계층
   원천: GCMS (Google Sheets 기반 구축진척관리시스템)
   매핑 기준: NSM 개발 화면정의서 V2.0 (PROJECT등록 필드 체계)
   ══════════════════════════════════════════════════════════════════ */
const DATA = (() => {

  /* ── 화면정의서 기준 코드 정의 ──────────────────────────────── */
  const CODE = {
    // 구축상태 (진행상태)
    STATUS: ['진행', '완료', '지연', '보류', '반품'],
    // 구축구분 (구축방식) — KPI 1.4 / 3.1 FAR 산출 기준
    METHOD: ['방문구축', 'FoEX교육(단독)', 'FoEX교육(1:N)', 'FoEX교육(1:N)+방문'],
    // 제품형태 → 서버유형 (KPI 1.5 SaaS vs 구축형 Gap 산출 기준)
    SERVER: ['SaaS', '구축형'],
    // 프로젝트구분
    PJT_TYPE: ['신규', '추가'],
  };

  /* 진행 종결 상태 — 화면정의서 slide5: "진행부분은 진행상태가 <완료,반품>이 아닌 것 적용" */
  const CLOSED = ['완료', '반품'];

  /* ── 단일 레코드 정규화 ─────────────────────────────────────── */
  function normalizeRow(r) {
    const unit = (r.department || '').replace('본사(', '').replace(')', '') || '미지정';
    const isSaaS = (r.product_type || '').includes('SaaS');
    const method = r.construction_type || '미분류';

    // 화면정의서 slide8 공수정보 필드 매핑
    //   계약공수      ← standard_hours (모듈별 표준공수 합)
    //   예상공수(유)  ← expected_hours
    //   예상공수(무)  = 계약공수 − 예상공수(유)      [slide8 계산식]
    //   투입공수(유)  ← invested_hours
    //   잔여공수      = 예상공수(유) − 투입공수(유)  [slide9 계산식]
    const mdContract = num(r.standard_hours);
    const mdPlanPaid = num(r.expected_hours);
    const mdPlanFree = Math.max(0, mdContract - mdPlanPaid);
    const mdInPaid = num(r.invested_hours);
    const mdRemain = mdPlanPaid - mdInPaid;

    // 수행기간 — slide8: 일수[구축시작일 ~ 구축완료보고일]
    //   ※ GCMS 미보유 필드(구축시작일/완료보고일/보류기간) → 접수일~완료예정일 대체 산출
    const days = dayDiff(r.receipt_date, r.expected_completion);

    return {
      no: r.no,
      projectCode: r.project_code,          // 프로젝트코드 (PAS/PAC + YYMM + 일련 3자리)
      customer: r.customer,                 // 거래처명
      dept: r.department,                   // 구축부서
      unit,                                 // Unit 축약
      pm: r.pm,                             // PM
      status: r.status,                     // 구축상태
      method,                               // 구축구분(구축방식)
      receiptDate: r.receipt_date,          // 구축접수일
      dueDate: r.expected_completion,       // 구축완료예정일
      productType: r.product_type,          // 제품구분
      serverType: isSaaS ? 'SaaS' : '구축형', // 서버유형 (파생)
      pjtType: r.project_type,              // 프로젝트구분(신규/추가)
      constructorsRaw: r.constructors || '',
      assignees: parseAssignees(r.constructors),  // 배정정보 (담당자·모듈)

      // 공수정보
      mdContract, mdPlanPaid, mdPlanFree, mdInPaid, mdRemain,
      progress: num(r.progress_rate),
      days,

      // 파생 플래그
      isFoEX: method.startsWith('FoEX'),
      isPureFoEX: method === 'FoEX교육(단독)' || method === 'FoEX교육(1:N)',
      isClosed: CLOSED.includes(r.status),
      isActive: !CLOSED.includes(r.status),   // 진행 중 (지연·보류 포함)
      receiptYM: (r.receipt_date || '').slice(0, 7),
      receiptYear: (r.receipt_date || '').slice(0, 4),
      dueYM: (r.expected_completion || '').slice(0, 7),
    };
  }

  /* ── 배정정보 파싱: "김규태(UC,인사)/이정화(회계)" ───────────── */
  function parseAssignees(str) {
    if (!str) return [];
    return String(str).split('/').map(p => {
      const m = p.trim().match(/^(.+?)\((.+)\)$/);
      if (!m) return p.trim() ? { name: p.trim(), modules: [] } : null;
      return {
        name: m[1].trim(),
        modules: m[2].split(',').map(x => x.trim()).filter(Boolean)
      };
    }).filter(Boolean);
  }

  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);

  function dayDiff(a, b) {
    if (!a || !b) return null;
    const d1 = new Date(a), d2 = new Date(b);
    if (isNaN(d1) || isNaN(d2)) return null;
    return Math.round((d2 - d1) / 86400000);
  }

  /* ── 담당자(구축자) 집계 — 화면정의서 slide21 공수현황(개인) ── */
  function buildAssigneeStats(rows) {
    const map = new Map();
    rows.forEach(p => {
      p.assignees.forEach(a => {
        if (!map.has(a.name)) {
          map.set(a.name, {
            name: a.name, projects: 0, active: 0, done: 0, delayed: 0,
            mdContract: 0, mdPlanPaid: 0, mdInPaid: 0,
            modules: new Map(), units: new Set(), lastDate: ''
          });
        }
        const s = map.get(a.name);
        s.projects++;
        if (p.status === '완료') s.done++;
        if (p.status === '지연') s.delayed++;
        if (p.isActive) s.active++;
        s.mdContract += p.mdContract;
        s.mdPlanPaid += p.mdPlanPaid;
        s.mdInPaid += p.mdInPaid;
        s.units.add(p.unit);
        if (p.receiptDate > s.lastDate) s.lastDate = p.receiptDate;
        a.modules.forEach(m => s.modules.set(m, (s.modules.get(m) || 0) + 1));
      });
    });
    return [...map.values()].map(s => ({
      ...s,
      mdRemain: s.mdPlanPaid - s.mdInPaid,
      // 생산성 = 계약(표준)공수 / 투입공수 × 100
      productivity: s.mdInPaid > 0 ? (s.mdContract / s.mdInPaid * 100) : null,
      topModules: [...s.modules.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5),
      unitList: [...s.units].join(', ')
    })).sort((a, b) => b.projects - a.projects);
  }

  /* ── PM 집계 ─────────────────────────────────────────────────── */
  function buildPMStats(rows) {
    const map = new Map();
    rows.forEach(p => {
      if (!map.has(p.pm)) map.set(p.pm, {
        name: p.pm, total: 0, done: 0, active: 0, delayed: 0, held: 0,
        mdContract: 0, mdInPaid: 0, units: new Set()
      });
      const s = map.get(p.pm);
      s.total++;
      if (p.status === '완료') s.done++;
      if (p.status === '지연') s.delayed++;
      if (p.status === '보류') s.held++;
      if (p.isActive) s.active++;
      s.mdContract += p.mdContract;
      s.mdInPaid += p.mdInPaid;
      s.units.add(p.unit);
    });
    return [...map.values()].map(s => ({
      ...s,
      doneRate: s.total > 0 ? s.done / s.total * 100 : 0,
      productivity: s.mdInPaid > 0 ? s.mdContract / s.mdInPaid * 100 : null,
      unitList: [...s.units].join(', ')
    })).sort((a, b) => b.total - a.total);
  }

  /* ── 월별 시계열 — KPI 1.3 재공 처리 속도 산출용 ─────────────── */
  function buildMonthly(rows) {
    const m = new Map();
    const touch = ym => {
      if (!m.has(ym)) m.set(ym, { ym, received: 0, completed: 0, returned: 0, amountless: 0 });
      return m.get(ym);
    };
    rows.forEach(p => {
      if (p.receiptYM) touch(p.receiptYM).received++;
      // 완료 시점 원천(구축완료보고일) 미보유 → 완료예정일을 완료 시점 대체값으로 사용
      if (p.status === '완료' && p.dueYM) touch(p.dueYM).completed++;
      if (p.status === '반품' && p.dueYM) touch(p.dueYM).returned++;
    });
    const list = [...m.values()].sort((a, b) => a.ym.localeCompare(b.ym));
    // 재공(WIP) 잔여 누적 = 누적접수 − 누적완료 − 누적반품
    let cr = 0, cc = 0, cx = 0;
    list.forEach(r => {
      cr += r.received; cc += r.completed; cx += r.returned;
      r.cumReceived = cr; r.cumCompleted = cc; r.cumReturned = cx;
      r.wip = cr - cc - cx;
    });
    return list;
  }

  /* ── 그룹 집계 헬퍼 ──────────────────────────────────────────── */
  function groupBy(rows, keyFn) {
    const m = new Map();
    rows.forEach(p => {
      const k = keyFn(p);
      if (!m.has(k)) m.set(k, {
        key: k, total: 0, done: 0, active: 0, delayed: 0, held: 0, returned: 0,
        mdContract: 0, mdPlanPaid: 0, mdInPaid: 0
      });
      const s = m.get(k);
      s.total++;
      if (p.status === '완료') s.done++;
      if (p.status === '지연') s.delayed++;
      if (p.status === '보류') s.held++;
      if (p.status === '반품') s.returned++;
      if (p.isActive) s.active++;
      s.mdContract += p.mdContract;
      s.mdPlanPaid += p.mdPlanPaid;
      s.mdInPaid += p.mdInPaid;
    });
    return [...m.values()].map(s => ({
      ...s,
      doneRate: s.total > 0 ? s.done / s.total * 100 : 0,
      productivity: s.mdInPaid > 0 ? s.mdContract / s.mdInPaid * 100 : null
    })).sort((a, b) => b.total - a.total);
  }

  /* ── 데이터셋 빌드 ───────────────────────────────────────────── */
  function build(raw) {
    const rows = raw.map(normalizeRow);
    return {
      rows,
      CODE,
      assignees: buildAssigneeStats(rows),
      pms: buildPMStats(rows),
      monthly: buildMonthly(rows),
      byMethod: groupBy(rows, p => p.method),
      byUnit: groupBy(rows, p => p.unit),
      byServer: groupBy(rows, p => p.serverType),
      byPjtType: groupBy(rows, p => p.pjtType),
      groupBy,
      meta: {
        count: rows.length,
        firstReceipt: rows.reduce((a, p) => (!a || (p.receiptDate && p.receiptDate < a)) ? p.receiptDate : a, ''),
        lastReceipt: rows.reduce((a, p) => (p.receiptDate > a ? p.receiptDate : a), ''),
      }
    };
  }

  return { build, normalizeRow, parseAssignees, groupBy, CODE };
})();

      def: '연초 접수 잔여건 중 전년도에서 넘어온 이월 비중. 연간 처리 과부하 구조의 선행 지표.',
      formula: '이월 부담률(%) = 전년 이월건 / 연초 전체 잔여건 × 100\n연초 전체 잔여건 = 전년이월 + 당해연도 1월 신규접수',
      source: 'GCMS: 이월 분류 코드',
      cycle: '연 1회 (1월 첫째 주)',
      target: '이월 부담률 60% 이하', targetVal: 60, op: 'lte', unit: '%',
      asIs: '81.3% (2026년 1월 — 과부하)', state: 'auto',
      note: '연말 잔여건 사전 협의·완료 강화로 구조 개선 필요. 연말 이월 50건 이하 목표.',
      calc: D => {
        const years = [...new Set(D.rows.map(p => p.receiptYear).filter(Boolean))].sort();
        const last = years[years.length - 1];
        if (!last) return NA;
        // 전년 이월 = 전년도 이전 접수 중 당해 1월 시점 미완결
        const carry = D.rows.filter(p => p.receiptYear < last && p.isActive).length;
        const janNew = D.rows.filter(p => p.receiptYM === `${last}-01`).length;
        const v = pct(carry, carry + janNew);
        return {
          v, disp: f1(v) + '%',
          sub: `${last}년 기준 · 이월 ${carry.toLocaleString()}건 / 1월 신규 ${janNew.toLocaleString()}건`
        };
      }
    },
    {
      id: '6.2', pillar: 6, name: 'Go-live 후 30일 안정성',
      def: '개통 후 첫 30일 내 Critical 장애(Sev1) 발생 건수. 구축 품질의 최종 검증 지표.',
      formula: 'Stability = COUNT(Sev1 incident, 개통일 ~ 개통일+30일)\nSev1 = 업무 중단·데이터 손실·결산 불가 등 Critical 장애',
      source: 'ITSM: Incident 로그 (현재 수기 접수 → 시스템화 필요)',
      cycle: '프로젝트별',
      target: 'Sev1 0건, Sev2 3건 이내', targetVal: 0, op: 'lte', unit: '건',
      asIs: '미집계', state: 'pending',
      note: 'ITSM Incident 로그 시스템화가 선결 과제. Phase 3 로드맵 항목.',
      calc: () => NA
    },
    {
      id: '6.3', pillar: 6, star: true, name: '지연 프로젝트 비율 (RAG Red%)',
      def: '구축 기간 내 정상 처리가 어렵거나 60일 이상 미완료로 경고 상태인 프로젝트 비율.',
      formula: 'Red% = 지연(Red) 프로젝트 수 / 전체 진행 프로젝트 수 × 100\nRed 기준: 약정 완료일 초과 또는 60일 이상 진행 중인 건\nAmber 기준: 약정 완료일 D-14일 이내 / 중간 게이트 지연',
      source: 'GCMS: RAG 상태코드 / 완료 약정일 대비 현재일 비교',
      cycle: '주간 스냅샷',
      target: 'Red% 8% 이하 (단기), 5% 이하 (연말)', targetVal: 8, op: 'lte', unit: '%',
      asIs: '11.2% (EQT Median 5%)', state: 'auto',
      note: '지연 구축진행 현황 80건 → 40건 축소 목표.',
      calc: D => {
        const act = activeOf(D);
        const red = act.filter(p => p.status === '지연').length;
        const amber = act.filter(p => p.status === '보류').length;
        const v = pct(red, act.length);
        return {
          v, disp: f1(v) + '%',
          sub: `Red ${red}건 / 진행 ${act.length.toLocaleString()}건`,
          detail: [
            { label: 'Red (지연)', value: `${red}건 · ${f1(v)}%` },
            { label: 'Amber (보류)', value: `${amber}건 · ${f1(pct(amber, act.length))}%` },
            { label: 'Green (정상 진행)', value: `${act.length - red - amber}건` }
          ]
        };
      }
    },
    {
      id: '6.4', pillar: 6, name: 'H/W 조달 대기 리스크 지수',
      def: 'On-prem 구축형 프로젝트에서 H/W 납품 대기로 착수 지연된 건수. 구축형 완료율 저하의 핵심 원인.',
      formula: 'H/W 대기율(%) = H/W 대기 건 / 전체 구축형 진행 건 × 100\n평균 대기일 = AVG(H/W 납품일 − 착수 예정일)',
      source: 'GCMS: 서버유형코드(구축형) + 착수 지연사유 코드',
      cycle: '주간',
      target: 'H/W 대기율 10% 이하, 평균 대기일 14일 이하', targetVal: 10, op: 'lte', unit: '%',
      asIs: '추정 20%+ (평균 대기 18일)', state: 'proxy',
      note: '착수 지연사유 코드 미보유 → 분모(구축형 진행건)만 산출. 화면정의서 [구축정보] 탭 <지연사유> 코드 신설 필요.',
      calc: D => {
        const onp = activeOf(D).filter(p => p.serverType === '구축형');
        const zero = onp.filter(p => p.mdInPaid === 0).length;   // 미착수(투입 0) = H/W 대기 추정
        const v = pct(zero, onp.length);
        return {
          v, disp: f1(v) + '%',
          sub: `구축형 진행 ${onp.length}건 중 미착수(투입 0MD) ${zero}건`,
          detail: [{ label: '※ 추정 기준', value: '투입공수 0MD = 착수 대기 간주' }]
        };
      }
    },

    /* ═══════════ Pillar 7 — AI Transformation ═══════════ */
    {
      id: '7.1', pillar: 7, name: 'PM·컨설턴트 AI 도구 활용률 (DAU%)',
      def: 'Claude/Copilot 등 AI 도구를 일일 활성 사용하는 PM·컨설턴트 비율. 내부 AI 역량의 핵심 지표.',
      formula: 'AI DAU% = AI 도구 일일 활성 인원 / 전체 구축 인력 × 100\n주간 활성(WAU)으로 대체 측정 가능',
      source: 'HR: AI 도구 사용현황 로그 (IT인프라 협력)',
      cycle: '주간',
      target: 'DAU/WAU 70%+ (Green) / 40~70% (Amber) / 40% 미만 (Red)', targetVal: 70, op: 'gte', unit: '%',
      asIs: '미집계', state: 'pending',
      note: '분모(전체 구축 인력)는 GCMS 배정정보로 산출 가능. AI 도구 사용 로그는 IT인프라 협력 필요.',
      calc: D => ({ v: null, disp: '연동 필요', sub: `분모 산출 가능: 구축 인력 ${D.assignees.length}명`, detail: [] })
    },
    {
      id: '7.2', pillar: 7, star: true, name: 'AI 기인 공수 절감률',
      def: '표준 공수 대비 AI 도구 활용 시 실제 투입 공수 감소율. AI 생산성 향상의 정량 증명.',
      formula: 'AI 공수 절감률(%) = (표준공수 − 실투입공수) / 표준공수 × 100\n표준공수 = 공수표준표 기준 (기능·규모별 표준 MD)',
      source: 'GCMS: 투입 MD / 공수표준표: 표준 MD 기준',
      cycle: '프로젝트별 → 분기 평균',
      target: '15%+ (1년차), 20%+ (2년차)', targetVal: 15, op: 'gte', unit: '%',
      asIs: '측정 필요', state: 'auto',
      note: 'AI 활용 프로젝트 플래그 미보유 → 전체 완료 프로젝트 기준 산출. AI 활용 여부 코드 추가 시 정밀 산출 가능.',
      calc: D => {
        const done = D.rows.filter(p => p.status === '완료' && p.mdContract > 0 && p.mdInPaid > 0);
        if (!done.length) return NA;
        const std = done.reduce((a, p) => a + p.mdContract, 0);
        const inp = done.reduce((a, p) => a + p.mdInPaid, 0);
        const v = (std - inp) / std * 100;
        return {
          v, disp: f1(v) + '%',
          sub: `표준 ${f0(std)}MD → 투입 ${f0(inp)}MD (완료 ${done.length.toLocaleString()}건)`,
          detail: [{ label: '절감 공수', value: `${f0(std - inp)} MD` }]
        };
      }
    },
    {
      id: '7.3', pillar: 7, name: 'Embedded AI ARR 비중',
      def: 'iCUBE→A10 전환 업세일 시 AI 기능 포함 요금 차이(업세일 ARR) 비중. AI 가치의 재무적 가시화.',
      formula: 'Embedded AI ARR = Σ(A10 월요금 − iCUBE 환산 월요금) × 12  [EMB_AI 코드 건]\nEmbedded AI ARR% = Embedded AI ARR / 전체 A10 ARR × 100',
      source: 'NSM10/AMS: 계약유형 코드(EMB_AI), 마이그레이션 계약 전후 요금',
      cycle: '분기',
      target: '전체 ARR 대비 10%+', targetVal: 10, op: 'gte', unit: '%',
      asIs: '미집계', state: 'pending',
      note: 'NSM10 EMB_AI 계약유형 코드 신설 + 전환 전후 요금 이력 관리 필요.',
      calc: () => NA
    },
  ];

  /* ── Executive Dashboard 6대 KPI (가이드라인 §2) ─────────────── */
  const EXEC = ['1.1', '2.1', '1.3', '1.4', '1.5', '1.6'];

  /* ── 목표 대비 판정 ──────────────────────────────────────────── */
  function judge(k, v) {
    if (v === null || v === undefined || !isFinite(v) || k.targetVal === undefined)
      return { cls: 'idle', txt: '측정 대기' };
    const t = k.targetVal;
    const ok = k.op === 'lte' ? v <= t : v >= t;
    if (ok) return { cls: 'ok', txt: '달성' };
    // 목표의 80% 이상 근접 시 주의
    const ratio = k.op === 'lte' ? t / v : v / t;
    return ratio >= 0.8 ? { cls: 'warn', txt: '주의' } : { cls: 'risk', txt: '미달' };
  }

  /* ── 전체 산출 실행 ──────────────────────────────────────────── */
  function computeAll(D) {
    const out = new Map();
    LIST.forEach(k => {
      let r;
      try { r = k.calc(D) || NA; }
      catch (e) { r = { v: null, disp: '산출 오류', sub: String(e.message || e), detail: [] }; }
      out.set(k.id, { ...k, result: r, judge: judge(k, r.v) });
    });
    return out;
  }

  const summary = computed => {
    const all = [...computed.values()];
    return {
      total: all.length,
      auto: all.filter(k => k.state === 'auto').length,
      proxy: all.filter(k => k.state === 'proxy').length,
      pending: all.filter(k => k.state === 'pending').length,
      ok: all.filter(k => k.judge.cls === 'ok').length,
      risk: all.filter(k => k.judge.cls === 'risk').length,
    };
  };

  return { PILLARS, LIST, EXEC, computeAll, judge, summary };
})();

/* ══════════════════════════════════════════════════════════════════
   PKG 구축통합관리 — 화면 렌더러
   화면 근거: NSM 개발 화면정의서 V2.0 + ERP 관리지표 가이드라인 v1.0
   ══════════════════════════════════════════════════════════════════ */
const VIEWS = (() => {

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f1 = v => (v === null || v === undefined || !isFinite(v)) ? '—' : v.toFixed(1);
  const f0 = v => (v === null || v === undefined || !isFinite(v)) ? '—' : Math.round(v).toLocaleString();
  const nz = (v, alt = '—') => (v === null || v === undefined || v === '') ? alt : v;
  const PACC = n => `--pbg:var(--p${n}-bg);--pacc:var(--p${n}-acc);--pmid:var(--p${n}-mid)`;
  const ST_LABEL = { auto: '자동산출', proxy: '대체산출', pending: '연동 필요' };

  /* ════════════════════════════════════════════════════════════
     1. Executive Dashboard — 가이드라인 §2 6대 핵심 KPI
     ════════════════════════════════════════════════════════════ */
  function renderExec(D, K) {
    const cards = KPI.EXEC.map((id, i) => {
      const k = K.get(id); if (!k) return '';
      const acc = `var(--p${k.pillar}-acc)`;
      const r = k.result;
      const prog = (k.targetVal !== undefined && r.v !== null && isFinite(r.v))
        ? Math.max(0, Math.min(100, k.op === 'lte'
            ? (r.v <= 0 ? 100 : Math.min(100, k.targetVal / r.v * 100))
            : r.v / k.targetVal * 100))
        : 0;
      return `<div class="exec-card" style="--acc:${acc}">
        <div class="k-name">${esc(k.name)}</div>
        <div class="k-val">${r.v !== null && isFinite(r.v) ? esc(r.disp) : `<span style="font-size:.95rem;color:var(--tx-m)">${esc(r.disp)}</span>`}</div>
        <div class="k-meta">${esc(r.sub || k.def.slice(0, 34))}</div>
        <div class="bar"><i style="width:${prog}%"></i></div>
        <div class="k-target">
          <span>목표 ${k.op === 'lte' ? '≤' : '≥'} ${k.targetVal ?? '—'}${k.unit || ''}</span>
          <span class="judge ${k.judge.cls}">${k.judge.txt}</span>
        </div>
      </div>`;
    }).join('');

    const s = KPI.summary(K);
    const act = D.rows.filter(p => p.isActive).length;
    const done = D.rows.filter(p => p.status === '완료').length;

    $('v-exec').innerHTML = `
      <div class="sec-head">
        <h2>Executive Dashboard</h2>
        <span class="sub">사업본부장·PM총괄 단일 화면 — 관리지표 가이드라인 v1.0 §2 6대 핵심 KPI</span>
      </div>
      <div class="exec-grid">${cards}</div>

      <div class="g3">
        <div class="card">
          <div class="sec-head"><h2 style="font-size:.9rem">KPI 산출 커버리지</h2></div>
          ${bar2('자동 산출 (GCMS 현행)', s.auto, s.total, 'var(--ok)')}
          ${bar2('대체 산출 (원천 일부 부재)', s.proxy, s.total, 'var(--warn)')}
          ${bar2('연동 필요 (Phase 1~3)', s.pending, s.total, 'var(--idle)')}
          <div style="margin-top:.8rem;padding-top:.7rem;border-top:1px dashed var(--bd-light);font-size:.74rem;color:var(--tx-s)">
            총 <b style="color:var(--tx-h)">${s.total}개</b> KPI 중
            <b style="color:var(--ok)">${s.auto + s.proxy}개</b> 현행 데이터로 산출 중
          </div>
        </div>
        <div class="card">
          <div class="sec-head"><h2 style="font-size:.9rem">구축 진행 현황</h2></div>
          ${D.groupBy(D.rows, p => p.status).map(g =>
            bar2(g.key, g.total, D.rows.length, statusColor(g.key))).join('')}
        </div>
        <div class="card">
          <div class="sec-head"><h2 style="font-size:.9rem">핵심 요약</h2></div>
          <div class="fld-grid" style="grid-template-columns:1fr 1fr">
            ${fld('총 접수', D.rows.length.toLocaleString() + '건')}
            ${fld('완료', done.toLocaleString() + '건')}
            ${fld('진행 중', act.toLocaleString() + '건')}
            ${fld('구축 인력', D.assignees.length + '명')}
            ${fld('활성 PM', new Set(D.rows.filter(p => p.isActive).map(p => p.pm)).size + '명')}
            ${fld('데이터 기간', `${D.meta.firstReceipt} ~ ${D.meta.lastReceipt}`)}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="sec-head">
          <h2 style="font-size:.9rem">월별 접수 · 완료 · 재공(WIP) 추이</h2>
          <span class="sub">KPI 1.3 재공 처리 속도 산출 기반 · 접수 마지막 월까지 표시</span>
        </div>
        ${monthlyChart(D.monthly.filter(m => m.ym <= D.meta.lastReceipt.slice(0, 7)).slice(-14))}
      </div>`;
  }

  const statusColor = s => ({ '완료': 'var(--ok)', '진행': 'var(--info)', '지연': 'var(--risk)', '보류': 'var(--warn)', '반품': '#A855F7' }[s] || 'var(--idle)');

  function bar2(label, n, d, color) {
    const p = d > 0 ? n / d * 100 : 0;
    return `<div class="rank">
      <div class="rh"><span class="n">${esc(label)}</span><span class="s">${n.toLocaleString()}건 · ${f1(p)}%</span></div>
      <div class="bar"><i style="width:${p}%;background:${color}"></i></div>
    </div>`;
  }
  const fld = (l, v, na) => `<div class="fld"><div class="l">${esc(l)}</div><div class="v ${na ? 'na' : ''}">${esc(v)}</div></div>`;

  function monthlyChart(ms) {
    if (!ms.length) return '<p style="color:var(--tx-m)">데이터 없음</p>';
    const max = Math.max(...ms.map(m => Math.max(m.received, m.completed))) || 1;
    return `<div class="chart">${ms.map(m => `
      <div class="col" title="${m.ym} · 접수 ${m.received}건 / 완료 ${m.completed}건 / 재공(WIP) ${m.wip}건">
        <div class="v">${m.received}</div>
        <div class="bars">
          <div class="b" style="height:${(m.received / max * 100).toFixed(1)}%"></div>
          <div class="b done" style="height:${(m.completed / max * 100).toFixed(1)}%"></div>
        </div>
        <div class="l">${m.ym.slice(2)}</div>
      </div>`).join('')}</div>
      <div class="chart-legend">
        <span><i style="background:#3B4FC8"></i>접수</span>
        <span><i style="background:#16A34A"></i>완료</span>
        <span style="color:var(--tx-m);font-weight:500">※ 막대에 마우스를 올리면 재공(WIP) 잔여건이 표시됩니다</span>
      </div>`;
  }

  /* ════════════════════════════════════════════════════════════
     2. KPI Definition Book — 7 Pillar 전체
     ════════════════════════════════════════════════════════════ */
  function renderBook(D, K) {
    const s = KPI.summary(K);
    const pillars = KPI.PILLARS.map(P => {
      const items = KPI.LIST.filter(k => k.pillar === P.no).map(k => kpiCard(K.get(k.id))).join('');
      const cnt = KPI.LIST.filter(k => k.pillar === P.no).length;
      return `<div class="pillar" style="${PACC(P.no)}">
        <div class="pillar-head">
          <div class="no">${P.no}</div>
          <h3>${esc(P.ko)}</h3>
          <span class="en">${esc(P.name)}</span>
          <span class="spacer"></span>
          <span class="chip" style="background:var(--pacc);color:#fff;border:none">KPI ${cnt}개</span>
          <div class="desc">${esc(P.desc)}</div>
        </div>
        <div class="pillar-body">${items}</div>
      </div>`;
    }).join('');

    ['pj-q', 'pj-st', 'pj-dept', 'pj-mt', 'pj-pt', 'pj-f', 'pj-t'].forEach(id => {
      const el = $(id);
      el.addEventListener('input', () => { PJ.page = 1; applyPJ(D); });

  function applyPJ(D) {
    const q = $('pj-q').value.trim().toLowerCase();
    const st = $('pj-st').value, dept = $('pj-dept').value, mt = $('pj-mt').value, pt = $('pj-pt').value;
    const from = $('pj-f').value, to = $('pj-t').value;
    PJ.filtered = D.rows.filter(p => {
      if (q && !(p.projectCode?.toLowerCase().includes(q) || p.customer?.toLowerCase().includes(q) || p.pm?.toLowerCase().includes(q))) return false;
      if (st && p.status !== st) return false;
      if (dept && p.unit !== dept) return false;
      if (mt && p.method !== mt) return false;
      if (pt && p.productType !== pt) return false;
      if (from && p.receiptDate < from) return false;
      if (to && p.receiptDate > to) return false;
      return true;
    });
    drawPJ(D);
  }

  function drawPJ(D) {
    const tot = PJ.filtered.length, pages = Math.max(1, Math.ceil(tot / PJ.size));
    PJ.page = Math.min(PJ.page, pages);

    const sumC = PJ.filtered.reduce((a, p) => a + p.mdContract, 0);

    $('pj-pager').innerHTML = pager(pages, PJ.page, 'VIEWS.goPJ');

  function pager(pages, cur, fn) {
    if (pages <= 1) return '';
    const b = [`<button class="pg" onclick="${fn}(${cur - 1})" ${cur === 1 ? 'disabled' : ''}>◀</button>`];
    const s = Math.max(1, cur - 2), e = Math.min(pages, cur + 2);
    if (s > 1) b.push(`<button class="pg" onclick="${fn}(1)">1</button>`, s > 2 ? '<span style="color:var(--tx-m)">…</span>' : '');
    for (let i = s; i <= e; i++) b.push(`<button class="pg ${i === cur ? 'active' : ''}" onclick="${fn}(${i})">${i}</button>`);
    if (e < pages) b.push(e < pages - 1 ? '<span style="color:var(--tx-m)">…</span>' : '', `<button class="pg" onclick="${fn}(${pages})">${pages}</button>`);
    b.push(`<button class="pg" onclick="${fn}(${cur + 1})" ${cur === pages ? 'disabled' : ''}>▶</button>`);
    return b.join('');
  }

              <b>3순위 — GCMS MD실적등록 Billable 구분 필드 추가</b><br>
              <span style="color:var(--tx-s);font-size:.73rem">BU%·건당 완료금액·CTD 산출의 핵심 원천. 프로젝트 코드 vs 공통(IDLE) 정확 입력 체계.</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  return {
    renderExec, renderBook, renderProjectShell, renderStatus, renderCapa, renderBench,
    selectPJ, goPJ, goTab, goCP
  };
})();

/* ===== js/app.js ===== */
/* ══════════════════════════════════════════════════════════════════
   PKG 구축통합관리 — 앱 셸 / 라우터
   ══════════════════════════════════════════════════════════════════ */
const APP = (() => {

  const TABS = [
    { id: 'exec',    label: '📊 Executive',      render: (D, K) => VIEWS.renderExec(D, K) },
    { id: 'book',    label: '📐 KPI Definition Book', render: (D, K) => VIEWS.renderBook(D, K) },
    { id: 'project', label: '📋 PROJECT 등록',    render: D => VIEWS.renderProjectShell(D), once: true },
    { id: 'status',  label: '📈 접수·완료 현황',  render: D => VIEWS.renderStatus(D), once: true },
    { id: 'capa',    label: '👥 공수현황(개인)',  render: D => VIEWS.renderCapa(D), once: true },
    { id: 'bench',   label: '🎯 EQT Benchmark',   render: (D, K) => VIEWS.renderBench(D, K), once: true },
  ];

  const S = { D: null, K: null, drawn: new Set(), current: 'exec' };

  /* ── 탭 전환 ─────────────────────────────────────────────────── */
  function go(id) {
    const t = TABS.find(x => x.id === id);
    if (!t) return;
    S.current = id;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + id));
    if (!t.once || !S.drawn.has(id)) {
      t.render(S.D, S.K);
      S.drawn.add(id);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ── 데이터 로드 ─────────────────────────────────────────────── */
  async function loadRaw() {
    // standalone 빌드 시 데이터가 HTML에 내장됨
    if (window.__GCMS_DATA__) return window.__GCMS_DATA__;
    const res = await fetch('data/gcms_data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status} — data/gcms_data.json`);
    return res.json();
  }

  /* ── 부팅 ────────────────────────────────────────────────────── */
  async function boot() {
    const nav = document.getElementById('nav');
    nav.innerHTML = TABS.map((t, i) =>
      `<button class="nav-btn ${i === 0 ? 'active' : ''}" data-tab="${t.id}" onclick="APP.go('${t.id}')">${t.label}</button>`
    ).join('');

    try {
      const raw = await loadRaw();
      S.D = DATA.build(raw);
      S.K = KPI.computeAll(S.D);

      const s = KPI.summary(S.K);
      document.getElementById('meta').innerHTML = `
        <span class="chip live">● GCMS 연동</span>
        <span class="chip">${S.D.meta.count.toLocaleString()}건</span>
        <span class="chip">KPI ${s.total}개 (산출 ${s.auto + s.proxy})</span>
        <span class="chip">${S.D.meta.lastReceipt} 기준</span>`;

      document.getElementById('foot-info').textContent =
        `총 ${S.D.meta.count.toLocaleString()}개 프로젝트 · 구축인력 ${S.D.assignees.length}명 · ` +
        `데이터 기간 ${S.D.meta.firstReceipt} ~ ${S.D.meta.lastReceipt}`;

      go('exec');
    } catch (e) {
      document.getElementById('boot').innerHTML = `
        <div class="err">
          <b>데이터를 불러오지 못했습니다</b>
          ${escapeHtml(e.message)}<br><br>
          브라우저에서 파일을 직접 열면(<code>file://</code>) 보안 정책으로 JSON을 읽을 수 없습니다.<br>
          아래 중 <b>하나</b>를 사용하세요.<br><br>
          <b>① 웹서버 없이 실행</b> — <code>index_standalone.html</code> 파일을 더블클릭<br>
          <b>② 웹서버로 실행</b> — 이 폴더에서 <code>python -m http.server 8080</code> 실행 후
          <code>http://localhost:8080</code> 접속
        </div>`;
      console.error(e);
    }
  }

  const escapeHtml = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  document.addEventListener('DOMContentLoaded', boot);

  return {
    go,
    get D() { return S.D; },
    get K() { return S.K; },
  };
})();

</script>
</body>
</html>
